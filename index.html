<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>סימולטור קליסטניקס תלת-ממדי - ביומכניקה מתקדמת (3D Calisthenics Simulator)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b1120;
            font-family: system-ui, -apple-system, sans-serif;
        }
        #canvas-container {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: auto;
            touch-action: none;
        }
        #canvas-container canvas {
            display: block;
            width: 100% !important;
            height: 100% !important;
            outline: none;
        }
        .glass-panel {
            background: rgba(15, 23, 42, 0.86);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.14);
        }
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.2); }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.25); border-radius: 3px; }
    </style>
</head>
<body class="text-slate-100 select-none">

    <!-- 3D Canvas Container -->
    <div id="canvas-container"></div>

    <!-- Top Status & Controls Header -->
    <div class="fixed top-3 left-3 right-3 z-20 flex flex-wrap items-center justify-between gap-2 pointer-events-none">
        <!-- Title & State Badge -->
        <div class="glass-panel rounded-2xl px-3.5 py-2.5 flex flex-wrap items-center gap-3 pointer-events-auto shadow-xl">
            <div>
                <h1 class="text-base sm:text-lg font-bold bg-gradient-to-l from-cyan-400 to-blue-500 bg-clip-text text-transparent">
                    סימולטור פריסטייל מתח 3D
                </h1>
                <p class="text-[11px] text-slate-400">ביומכניקה מלאה • הצלפת גוף, כבידה וגמישות מוט</p>
            </div>
            <div class="h-7 w-px bg-slate-700 hidden sm:block"></div>
            <div class="flex flex-col">
                <span class="text-[10px] uppercase tracking-wider text-slate-400">מצב נוכחי</span>
                <span id="state-badge" class="text-xs sm:text-sm font-semibold text-emerald-400">אחיזה במתח (Idle)</span>
            </div>
            <div class="flex flex-col">
                <span class="text-[10px] uppercase tracking-wider text-slate-400">תרגיל פעיל</span>
                <span id="current-move-badge" class="text-xs sm:text-sm font-semibold text-cyan-300">-</span>
            </div>
            <div class="flex flex-col">
                <span class="text-[10px] uppercase tracking-wider text-slate-400">כיוון מבט</span>
                <span id="facing-badge" class="text-xs font-bold text-amber-300">קדימה (+Z)</span>
            </div>
        </div>

        <!-- Camera & Speed Controls -->
        <div class="glass-panel rounded-2xl px-3 py-2 flex flex-wrap items-center gap-1.5 pointer-events-auto shadow-xl">
            <button type="button" onclick="setCameraView('side')" class="px-2.5 py-1.5 rounded-lg text-xs font-medium bg-slate-800 hover:bg-slate-700 border border-slate-700 transition cursor-pointer">מבט צד</button>
            <button type="button" onclick="setCameraView('threeQuarter')" class="px-2.5 py-1.5 rounded-lg text-xs font-medium bg-slate-800 hover:bg-slate-700 border border-slate-700 transition cursor-pointer">3/4 דינמי</button>
            <button type="button" onclick="setCameraView('follow')" id="btn-follow" class="px-2.5 py-1.5 rounded-lg text-xs font-medium bg-slate-800 hover:bg-slate-700 border border-slate-700 transition cursor-pointer">מעקב אתלט</button>
            <div class="h-5 w-px bg-slate-700 mx-0.5"></div>
            <button type="button" onclick="toggleSlowMo()" id="btn-slowmo" class="px-2.5 py-1.5 rounded-lg text-xs font-medium bg-slate-800 hover:bg-slate-700 border border-slate-700 transition cursor-pointer">הילוך איטי: 1.0x</button>
            <button type="button" onclick="resetAthlete()" class="px-2.5 py-1.5 rounded-lg text-xs font-bold bg-rose-600/85 hover:bg-rose-500 text-white transition cursor-pointer">איפוס למתח</button>
        </div>
    </div>

    <!-- Bottom Controls & Combo Queue -->
    <div class="fixed bottom-3 left-3 right-3 z-20 flex flex-col lg:flex-row items-stretch lg:items-end justify-between gap-2.5 pointer-events-none">
        
        <!-- Tricks Selection Panel (Compact by default, expandable via button) -->
        <div id="tricks-panel" class="glass-panel rounded-2xl p-2.5 pointer-events-auto shadow-2xl max-w-md w-full transition-all duration-300">
            <!-- Category Tabs & Expand Toggle -->
            <div class="flex flex-wrap items-center justify-between gap-1.5 mb-2 border-b border-slate-700/80 pb-1.5">
                <div class="flex flex-wrap gap-1">
                    <button type="button" onclick="switchTab('swing')" id="tab-swing" class="tab-btn px-2 py-1 rounded-lg text-[11px] font-bold bg-blue-600 text-white transition cursor-pointer">תנופה</button>
                    <button type="button" onclick="switchTab('spins')" id="tab-spins" class="tab-btn px-2 py-1 rounded-lg text-[11px] font-bold bg-slate-800 text-slate-300 hover:bg-slate-700 transition cursor-pointer">סיבובים</button>
                    <button type="button" onclick="switchTab('releases')" id="tab-releases" class="tab-btn px-2 py-1 rounded-lg text-[11px] font-bold bg-slate-800 text-slate-300 hover:bg-slate-700 transition cursor-pointer">עזיבות</button>
                    <button type="button" onclick="switchTab('dismounts')" id="tab-dismounts" class="tab-btn px-2 py-1 rounded-lg text-[11px] font-bold bg-slate-800 text-slate-300 hover:bg-slate-700 transition cursor-pointer">ירידות</button>
                </div>
                <button type="button" onclick="toggleTricksPanelSize()" id="btn-toggle-tricks" class="px-2.5 py-1 rounded-lg text-[11px] font-bold bg-slate-800 hover:bg-cyan-700/70 text-cyan-300 border border-slate-600 transition flex items-center gap-1 shrink-0 cursor-pointer">
                    <span id="toggle-tricks-icon">⤢</span>
                    <span id="toggle-tricks-text">הגדל</span>
                </button>
            </div>

            <!-- Tricks Grid -->
            <div id="tricks-container" class="grid grid-cols-2 sm:grid-cols-3 gap-1.5 max-h-[88px] overflow-y-auto pr-1 transition-all duration-300">
                <!-- Populated by JS -->
            </div>
        </div>

        <!-- Combo Builder Panel -->
        <div class="glass-panel rounded-2xl p-3 pointer-events-auto shadow-2xl w-full lg:w-88 xl:w-96 flex flex-col justify-between">
            <div class="flex items-center justify-between mb-1.5">
                <span class="text-xs font-bold text-slate-200">בניית רצף (Combo Queue)</span>
                <button type="button" onclick="clearCombo()" class="text-[11px] text-rose-400 hover:text-rose-300 cursor-pointer">נקה רצף</button>
            </div>
            
            <div id="combo-list" class="flex flex-wrap gap-1.5 min-h-[38px] max-h-[76px] overflow-y-auto bg-slate-950/60 rounded-xl p-2 border border-slate-800 mb-2.5 items-center">
                <span class="text-xs text-slate-500 italic">לחץ על + ליד תרגילים כדי לבנות רצף...</span>
            </div>

            <button type="button" onclick="playCombo()" id="btn-play-combo" class="w-full py-2 rounded-xl font-bold text-sm bg-gradient-to-l from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-white shadow-lg transition disabled:opacity-40 disabled:cursor-not-allowed cursor-pointer">
                ▶ בצע רצף תרגילים
            </button>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. מאגר התרגילים (Tricks Database)
        // ==========================================
        const TRICKS = {
            swing: [
                { id: 'tap_swing', name: 'Tap Swing', sub: 'הצלפת Arch-to-Hollow עמוקה', type: 'swing', duration: 1.56, amplitude: 2.35 },
                { id: 'giant_back', name: 'Back Giant', sub: 'סיבוב מלא אחורה', type: 'giant', direction: 1, duration: 1.50 },
                { id: 'giant_front', name: 'Front Giant', sub: 'סיבוב מלא קדימה', type: 'giant', direction: -1, duration: 1.50 }
            ],
            spins: [
                { id: 'spin_180', name: '180 Spin', sub: 'סווינג קדימה (+Z יחסי)', type: 'spin', relReleaseDir: 1, degrees: 180, height: 0.44, duration: 0.74 },
                { id: 'spin_360', name: '360 Spin', sub: 'סווינג אחורה (-Z יחסי)', type: 'spin', relReleaseDir: -1, degrees: 360, height: 0.50, duration: 0.80 },
                { id: 'spin_540', name: '540 Spin', sub: 'סווינג קדימה (+Z יחסי)', type: 'spin', relReleaseDir: 1, degrees: 540, height: 0.56, duration: 0.86 },
                { id: 'spin_720', name: '720 Spin', sub: 'סווינג אחורה (-Z יחסי)', type: 'spin', relReleaseDir: -1, degrees: 720, height: 0.62, duration: 0.94 },
                { id: 'spin_900', name: '900 Spin', sub: 'סווינג קדימה (+Z יחסי)', type: 'spin', relReleaseDir: 1, degrees: 900, height: 0.68, duration: 1.04 },
                { id: 'spin_1080', name: '1080 Spin', sub: 'סווינג אחורה (-Z יחסי)', type: 'spin', relReleaseDir: -1, degrees: 1080, height: 0.74, duration: 1.14 },
                { id: 'spin_1260', name: '1260 Spin', sub: 'סווינג קדימה (+Z יחסי)', type: 'spin', relReleaseDir: 1, degrees: 1260, height: 0.80, duration: 1.24 }
            ],
            releases: [
                { id: 'gienger', name: 'Gienger', sub: 'סווינג קדימה • Tucked • 180', type: 'release', crossBar: false, relReleaseDir: 1, flips: -1, twists: 0.5, peakHeight: 1.12, duration: 1.10 },
                { id: 'frisbee', name: 'Frisbee', sub: 'סווינג אחורה • Tucked • 360', type: 'release', crossBar: false, relReleaseDir: -1, flips: -1, twists: 1.0, peakHeight: 1.22, duration: 1.14 },
                { id: 'tkatchev', name: 'Straddle Tkatchev', sub: 'מעבר מעל המתח • פיסוק רגליים', type: 'release', crossBar: true, straddle: true, relReleaseDir: 1, flips: 0, twists: 0, peakHeight: 1.38, duration: 1.06 },
                { id: 'iceball_regrab', name: 'Iceball Regrab', sub: 'סווינג אחורה • סלטה קדמית + תפיסה', type: 'release', crossBar: false, relReleaseDir: -1, flips: 1, twists: 0, peakHeight: 1.48, extraOutZ: 0.68, duration: 1.12 },
                { id: 'b2b_regrab', name: 'B2B Regrab', sub: 'סווינג אחורה • סלטה אחורית + תפיסה', type: 'release', crossBar: false, relReleaseDir: -1, flips: -1, twists: 0, peakHeight: 1.48, extraOutZ: 0.68, duration: 1.12 },
                { id: 'fireball_regrab', name: 'Fireball Regrab', sub: 'סווינג קדימה • סלטה קדמית + תפיסה', type: 'release', crossBar: false, relReleaseDir: 1, flips: 1, twists: 0, peakHeight: 1.48, extraOutZ: 0.68, duration: 1.12 }
            ],
            dismounts: [
                { id: 'b2b', name: 'B2B', sub: 'סווינג אחורה (-Z יחסי)', type: 'dismount', relReleaseDir: -1, flips: -1, twists: 0, tuck: true, dist: 3.3, peakHeight: 0.95, duration: 1.18 },
                { id: 'layout_b2b', name: 'Layout B2B', sub: 'סווינג אחורה • גוף ישר', type: 'dismount', relReleaseDir: -1, flips: -1, twists: 0, tuck: false, dist: 3.8, peakHeight: 1.1, duration: 1.22 },
                { id: '360_b2b', name: '360 B2B', sub: 'סווינג אחורה • בורג 360', type: 'dismount', relReleaseDir: -1, flips: -1, twists: 1, tuck: true, dist: 3.6, peakHeight: 1.15, duration: 1.25 },
                { id: 'iceball', name: 'Iceball', sub: 'סווינג אחורה • סלטה קדמית', type: 'dismount', relReleaseDir: -1, flips: 1, twists: 0, tuck: true, dist: 3.4, peakHeight: 1.05, duration: 1.18 },
                { id: 'gainer', name: 'Gainer', sub: 'סווינג קדימה (+Z יחסי)', type: 'dismount', relReleaseDir: 1, flips: -1, twists: 0, tuck: true, dist: 3.3, peakHeight: 0.95, duration: 1.18 },
                { id: 'layout_gainer', name: 'Layout Gainer', sub: 'סווינג קדימה • גוף ישר', type: 'dismount', relReleaseDir: 1, flips: -1, twists: 0, tuck: false, dist: 3.8, peakHeight: 1.1, duration: 1.22 },
                { id: 'full_twist_gainer', name: 'Full Twist Gainer', sub: 'סווינג קדימה • בורג 360', type: 'dismount', relReleaseDir: 1, flips: -1, twists: 1, tuck: true, dist: 3.6, peakHeight: 1.15, duration: 1.25 },
                { id: 'fireball', name: 'Fireball', sub: 'סווינג קדימה • סלטה קדמית', type: 'dismount', relReleaseDir: 1, flips: 1, twists: 0, tuck: true, dist: 3.4, peakHeight: 1.05, duration: 1.18 }
            ]
        };

        // ==========================================
        // 2. משתנים גלובליים והגדרות סצנה
        // ==========================================
        let scene, camera, renderer, controls;
        let highBarMesh, barPivot, athlete, bodyMeshGroup;
        let leftArm, rightArm, leftElbow, rightElbow;
        let torso, pelvisGroup, headGroup;
        let leftLeg, rightLeg, leftKnee, rightKnee;

        const BAR_HEIGHT = 5.0;
        const MAT_HEIGHT = 0.35;
        const ATHLETE_HEIGHT = 1.85;
        const COM_OFFSET_Y = -0.95;
        const LANDED_ATHLETE_Y = -(BAR_HEIGHT - MAT_HEIGHT - ATHLETE_HEIGHT); // -2.80
        const GRAVITY = 12.2;

        let state = 'idle';
        let currentTrick = null;
        let trickTime = 0;
        let slowMoFactor = 1.0;
        let cameraMode = 'threeQuarter';
        let facingDir = 1;

        let currentBarAngle = 0;
        let swingWaypoints = [];
        let activeSwingSegment = null;
        let swingTime = 0;
        let giantCarryoverDir = 0;

        let releaseAthletePos = new THREE.Vector3();
        let releasePitchX = 0;
        let catchAthletePos = new THREE.Vector3();
        let catchTargetBarAngle = 0;
        let flightKinematics = { y0: 0, y1: 0, vy0: 0, gravity: GRAVITY, totalTime: 1.0 };

        let catchImpulseTime = 0;
        let catchImpulseStrength = 0;
        const CATCH_DAMP_DURATION = 0.42;

        let landingTime = 0;
        const LANDING_ABSORB_DURATION = 0.46;

        let comboQueue = [];
        let isPlayingCombo = false;
        let comboIndex = 0;
        let idleTime = 0;
        let activeTab = 'swing';
        let isTricksExpanded = false;
        let isInitialized = false;
        let lastSize = { w: 0, h: 0 };
        let clock;

        function getViewportSize() {
            const container = document.getElementById('canvas-container');
            const rect = container ? container.getBoundingClientRect() : null;
            const w = Math.max(
                rect && rect.width ? Math.round(rect.width) : 0,
                window.innerWidth || 0,
                document.documentElement.clientWidth || 0,
                800
            );
            const h = Math.max(
                rect && rect.height ? Math.round(rect.height) : 0,
                window.innerHeight || 0,
                document.documentElement.clientHeight || 0,
                600
            );
            return { w, h };
        }

        function initScene() {
            if (isInitialized) return;
            if (typeof THREE === 'undefined') {
                setTimeout(initScene, 50);
                return;
            }

            const container = document.getElementById('canvas-container');
            if (!container) return;

            isInitialized = true;
            const { w, h } = getViewportSize();
            lastSize = { w, h };

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0b1120);
            scene.fog = new THREE.FogExp2(0x0b1120, 0.017);

            camera = new THREE.PerspectiveCamera(48, w / h, 0.1, 100);
            camera.position.set(9.2, 4.8, 7.2);

            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(w, h, false);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.innerHTML = '';
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.target.set(0, 3.6, 0);
            controls.enableDamping = true;
            controls.dampingFactor = 0.06;
            controls.maxPolarAngle = Math.PI / 2 - 0.02;
            controls.minDistance = 2.5;
            controls.maxDistance = 26;

            const ambientLight = new THREE.AmbientLight(0xdbeafe, 0.72);
            scene.add(ambientLight);

            const mainLight = new THREE.DirectionalLight(0xffffff, 1.18);
            mainLight.position.set(8, 16, 10);
            mainLight.castShadow = true;
            mainLight.shadow.mapSize.width = 2048;
            mainLight.shadow.mapSize.height = 2048;
            mainLight.shadow.camera.near = 1;
            mainLight.shadow.camera.far = 45;
            const d = 14;
            mainLight.shadow.camera.left = -d;
            mainLight.shadow.camera.right = d;
            mainLight.shadow.camera.top = d;
            mainLight.shadow.camera.bottom = -d;
            scene.add(mainLight);

            const rimLight = new THREE.DirectionalLight(0x38bdf8, 0.48);
            rimLight.position.set(-10, 8, -10);
            scene.add(rimLight);

            const floor = new THREE.Mesh(
                new THREE.PlaneGeometry(60, 60),
                new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.85, metalness: 0.1 })
            );
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            const gridHelper = new THREE.GridHelper(60, 60, 0x334155, 0x1e293b);
            gridHelper.position.y = 0.01;
            scene.add(gridHelper);

            const landingMat = new THREE.Mesh(
                new THREE.BoxGeometry(3.6, MAT_HEIGHT, 24.0),
                new THREE.MeshStandardMaterial({ color: 0x1d4ed8, roughness: 0.6, metalness: 0.05 })
            );
            landingMat.position.set(0, MAT_HEIGHT / 2, 0);
            landingMat.receiveShadow = true;
            landingMat.castShadow = true;
            scene.add(landingMat);

            const lineMat = new THREE.MeshBasicMaterial({ color: 0x93c5fd });
            for (let z = -10; z <= 10; z += 2) {
                const stripe = new THREE.Mesh(new THREE.PlaneGeometry(3.5, z === 0 ? 0.12 : 0.05), lineMat);
                stripe.rotation.x = -Math.PI / 2;
                stripe.position.set(0, MAT_HEIGHT + 0.005, z);
                scene.add(stripe);
            }

            const pillarMat = new THREE.MeshStandardMaterial({ color: 0x475569, roughness: 0.4, metalness: 0.7 });
            const barMat = new THREE.MeshStandardMaterial({ color: 0xe2e8f0, roughness: 0.25, metalness: 0.9 });

            const pillarGeo = new THREE.CylinderGeometry(0.08, 0.11, BAR_HEIGHT, 16);
            [-1.6, 1.6].forEach(xPos => {
                const pillar = new THREE.Mesh(pillarGeo, pillarMat);
                pillar.position.set(xPos, BAR_HEIGHT / 2, 0);
                pillar.castShadow = true;
                scene.add(pillar);

                const base = new THREE.Mesh(new THREE.BoxGeometry(0.45, 0.08, 0.45), pillarMat);
                base.position.set(xPos, 0.04, 0);
                scene.add(base);
            });

            const barCurve = new THREE.LineCurve3(new THREE.Vector3(-1.65, 0, 0), new THREE.Vector3(1.65, 0, 0));
            const highBarGeo = new THREE.TubeGeometry(barCurve, 24, 0.024, 16, false);
            highBarGeo.userData.origPositions = highBarGeo.attributes.position.array.slice();
            highBarMesh = new THREE.Mesh(highBarGeo, barMat);
            highBarMesh.position.set(0, BAR_HEIGHT, 0);
            highBarMesh.castShadow = true;
            scene.add(highBarMesh);

            barPivot = new THREE.Group();
            barPivot.position.set(0, BAR_HEIGHT, 0);
            scene.add(barPivot);

            athlete = new THREE.Group();
            barPivot.add(athlete);

            const skinMat = new THREE.MeshStandardMaterial({ color: 0xf1c27d, roughness: 0.5 });
            const shirtMat = new THREE.MeshStandardMaterial({ color: 0x0ea5e9, roughness: 0.6 });
            const chestStripeMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.4 });
            const shortsMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.7 });
            const shoeMat = new THREE.MeshStandardMaterial({ color: 0xf43f5e, roughness: 0.5 });
            const wristWrapMat = new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.8 });

            bodyMeshGroup = new THREE.Group();
            bodyMeshGroup.position.set(0, COM_OFFSET_Y, 0);
            athlete.add(bodyMeshGroup);

            torso = new THREE.Mesh(new THREE.BoxGeometry(0.36, 0.52, 0.20), shirtMat);
            torso.position.set(0, 0.16, 0);
            torso.castShadow = true;
            bodyMeshGroup.add(torso);

            const frontStripe = new THREE.Mesh(new THREE.BoxGeometry(0.10, 0.48, 0.02), chestStripeMat);
            frontStripe.position.set(0, 0.16, 0.105);
            bodyMeshGroup.add(frontStripe);

            headGroup = new THREE.Group();
            headGroup.position.set(0, 0.54, 0);
            const head = new THREE.Mesh(new THREE.SphereGeometry(0.115, 20, 20), skinMat);
            head.castShadow = true;
            headGroup.add(head);

            const visor = new THREE.Mesh(
                new THREE.BoxGeometry(0.16, 0.04, 0.06),
                new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.2 })
            );
            visor.position.set(0, 0.01, 0.095);
            headGroup.add(visor);
            bodyMeshGroup.add(headGroup);

            function createArm(side) {
                const shoulderPivot = new THREE.Group();
                shoulderPivot.position.set(side * 0.23, 0.38, 0);

                const upperArm = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.040, 0.27, 14), skinMat);
                upperArm.position.set(0, 0.135, 0);
                upperArm.castShadow = true;
                shoulderPivot.add(upperArm);

                const elbowPivot = new THREE.Group();
                elbowPivot.position.set(0, 0.27, 0);
                shoulderPivot.add(elbowPivot);

                const forearm = new THREE.Mesh(new THREE.CylinderGeometry(0.040, 0.036, 0.27, 14), skinMat);
                forearm.position.set(0, 0.135, 0);
                forearm.castShadow = true;
                elbowPivot.add(forearm);

                const wrapMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.042, 0.042, 0.08, 14), wristWrapMat);
                wrapMesh.position.set(0, 0.23, 0);
                elbowPivot.add(wrapMesh);

                const handMesh = new THREE.Mesh(new THREE.SphereGeometry(0.048, 12, 12), skinMat);
                handMesh.position.set(0, 0.30, 0);
                elbowPivot.add(handMesh);

                return { shoulder: shoulderPivot, elbow: elbowPivot };
            }

            const lArmObj = createArm(-1);
            const rArmObj = createArm(1);
            leftArm = lArmObj.shoulder;
            leftElbow = lArmObj.elbow;
            rightArm = rArmObj.shoulder;
            rightElbow = rArmObj.elbow;
            bodyMeshGroup.add(leftArm);
            bodyMeshGroup.add(rightArm);

            pelvisGroup = new THREE.Group();
            pelvisGroup.position.set(0, -0.08, 0);
            bodyMeshGroup.add(pelvisGroup);

            const pelvisMesh = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.22, 0.21), shortsMat);
            pelvisMesh.position.set(0, -0.10, 0);
            pelvisMesh.castShadow = true;
            pelvisGroup.add(pelvisMesh);

            function createLeg(side) {
                const hipPivot = new THREE.Group();
                hipPivot.position.set(side * 0.105, -0.18, 0);

                const thigh = new THREE.Mesh(new THREE.CylinderGeometry(0.068, 0.055, 0.36, 14), shortsMat);
                thigh.position.set(0, -0.17, 0);
                thigh.castShadow = true;
                hipPivot.add(thigh);

                const kneePivot = new THREE.Group();
                kneePivot.position.set(0, -0.35, 0);
                hipPivot.add(kneePivot);

                const calf = new THREE.Mesh(new THREE.CylinderGeometry(0.052, 0.038, 0.36, 14), skinMat);
                calf.position.set(0, -0.17, 0);
                calf.castShadow = true;
                kneePivot.add(calf);

                const shoe = new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.06, 0.19), shoeMat);
                shoe.position.set(0, -0.32, 0.035);
                shoe.castShadow = true;
                kneePivot.add(shoe);

                return { hip: hipPivot, knee: kneePivot };
            }

            const lLegObj = createLeg(-1);
            const rLegObj = createLeg(1);
            leftLeg = lLegObj.hip;
            leftKnee = lLegObj.knee;
            rightLeg = rLegObj.hip;
            rightKnee = rLegObj.knee;
            pelvisGroup.add(leftLeg);
            pelvisGroup.add(rightLeg);

            if (typeof ResizeObserver !== 'undefined') {
                const ro = new ResizeObserver(() => handleResize());
                ro.observe(container);
            }

            clock = new THREE.Clock();
            handleResize();
            animate();
        }

        // ==========================================
        // 3. מכונת מצבים וביומכניקה מתקדמת
        // ==========================================
        function updateFacingBadge() {
            const badge = document.getElementById('facing-badge');
            if (facingDir === 1) {
                badge.textContent = 'קדימה (+Z)';
                badge.className = 'text-xs font-bold text-amber-300';
            } else {
                badge.textContent = 'אחורה (-Z)';
                badge.className = 'text-xs font-bold text-pink-400';
            }
        }

        function updateUIState(stateText, moveText = '-') {
            const badge = document.getElementById('state-badge');
            badge.textContent = stateText;
            document.getElementById('current-move-badge').textContent = moveText;

            badge.className = 'text-xs sm:text-sm font-semibold ';
            if (state === 'idle') badge.className += 'text-emerald-400';
            else if (state === 'prep_swing' || state === 'swinging') badge.className += 'text-amber-400';
            else if (state === 'flying' || state === 'dismounting') badge.className += 'text-cyan-400';
            else if (state === 'landing_impact' || state === 'landed') badge.className += 'text-purple-400';
        }

        function updateBarFlex(deflectionY) {
            if (!highBarMesh || !highBarMesh.geometry) return;
            const geo = highBarMesh.geometry;
            const orig = geo.userData.origPositions;
            const pos = geo.attributes.position.array;
            const halfSpan = 1.65;

            for (let i = 0; i < pos.length; i += 3) {
                const x = orig[i];
                const normX = Math.min(Math.abs(x) / halfSpan, 1.0);
                const bendFactor = Math.pow(1 - normX * normX, 1.5);
                pos[i + 1] = orig[i + 1] - deflectionY * bendFactor;
            }
            geo.attributes.position.needsUpdate = true;
        }

        function resetJointsToNeutral() {
            if (!leftArm) return;
            leftArm.rotation.set(0, 0, 0);
            rightArm.rotation.set(0, 0, 0);
            leftElbow.rotation.set(0, 0, 0);
            rightElbow.rotation.set(0, 0, 0);
            pelvisGroup.rotation.set(0, 0, 0);
            headGroup.rotation.set(0, 0, 0);
            leftLeg.rotation.set(0, 0, 0);
            rightLeg.rotation.set(0, 0, 0);
            leftKnee.rotation.set(0, 0, 0);
            rightKnee.rotation.set(0, 0, 0);
            torso.rotation.set(0, 0, 0);
            bodyMeshGroup.position.y = COM_OFFSET_Y;
        }

        function applySwingBiomechanics(barAngle, angularVelNorm, whipSnap = 0) {
            resetJointsToNeutral();

            const localSwingAngle = barAngle * facingDir;
            const localAngVel = angularVelNorm * facingDir;

            const archHollowCurve = Math.sin(localSwingAngle * 1.15) * 0.42 + localAngVel * 0.34 + whipSnap * 0.35;

            headGroup.rotation.x = THREE.MathUtils.clamp(-archHollowCurve * 0.45, -0.35, 0.35);
            pelvisGroup.rotation.x = -archHollowCurve * 0.42;
            leftLeg.rotation.x = -archHollowCurve * 0.48;
            rightLeg.rotation.x = -archHollowCurve * 0.48;

            const kneeWhipBend = Math.max(0, archHollowCurve) * 0.42;
            leftKnee.rotation.x = kneeWhipBend;
            rightKnee.rotation.x = kneeWhipBend;
        }

        function applyCatchImpactOverlay(dt) {
            if (catchImpulseTime <= 0) {
                updateBarFlex(0);
                return;
            }
            catchImpulseTime = Math.max(0, catchImpulseTime - dt);
            const tNorm = 1.0 - (catchImpulseTime / CATCH_DAMP_DURATION);

            const dampedWave = Math.exp(-tNorm * 5.2) * Math.sin(tNorm * Math.PI * 2.5);
            const stretchDown = Math.max(0, Math.sin(tNorm * Math.PI) * Math.exp(-tNorm * 2.8)) * catchImpulseStrength;

            updateBarFlex(stretchDown * 0.14);

            bodyMeshGroup.position.y = COM_OFFSET_Y - stretchDown * 0.09;
            leftElbow.rotation.x = -stretchDown * 0.32;
            rightElbow.rotation.x = -stretchDown * 0.32;
            pelvisGroup.rotation.x += dampedWave * 0.18 * catchImpulseStrength;
        }

        function setAirBiomechanics(mode, progress, extraAmount = 1.0) {
            resetJointsToNeutral();

            if (mode === 'tuck_progressive') {
                let tuckFactor = 0;
                if (progress < 0.22) {
                    const p = progress / 0.22;
                    tuckFactor = p * p;
                } else if (progress < 0.76) {
                    tuckFactor = 1.0;
                } else {
                    const p = (progress - 0.76) / 0.24;
                    tuckFactor = 1.0 - (p * p);
                }

                pelvisGroup.rotation.x = -0.35 * tuckFactor;
                leftLeg.rotation.x = -1.25 * tuckFactor;
                rightLeg.rotation.x = -1.25 * tuckFactor;
                leftKnee.rotation.x = 1.65 * tuckFactor;
                rightKnee.rotation.x = 1.65 * tuckFactor;

                const reachOut = progress > 0.76 ? ((progress - 0.76) / 0.24) : 0;
                leftArm.rotation.set(-2.1 * tuckFactor - 0.35 * reachOut, 0, -0.15 * tuckFactor);
                rightArm.rotation.set(-2.1 * tuckFactor - 0.35 * reachOut, 0, 0.15 * tuckFactor);
                leftElbow.rotation.set(-0.95 * tuckFactor * (1 - reachOut), 0, 0);
                rightElbow.rotation.set(-0.95 * tuckFactor * (1 - reachOut), 0, 0);
                headGroup.rotation.x = -0.3 * tuckFactor + 0.35 * reachOut;
            }
            else if (mode === 'layout_hollow') {
                const archCurve = Math.sin(progress * Math.PI) * 0.18;
                pelvisGroup.rotation.x = -archCurve;
                leftLeg.rotation.x = -archCurve * 0.8;
                rightLeg.rotation.x = -archCurve * 0.8;
                leftArm.rotation.set(-0.25, 0, -0.35);
                rightArm.rotation.set(-0.25, 0, 0.35);
            }
            else if (mode === 'straddle_dynamic') {
                const env = Math.sin(progress * Math.PI) * extraAmount;
                pelvisGroup.rotation.x = -0.35 * env;
                leftLeg.rotation.set(-0.75 * env, 0, -0.85 * env);
                rightLeg.rotation.set(-0.75 * env, 0, 0.85 * env);
                leftKnee.rotation.set(0.12 * env, 0, 0);
                rightKnee.rotation.set(0.12 * env, 0, 0);
                leftArm.rotation.set(-0.35 * env, 0, -0.55 * env);
                rightArm.rotation.set(-0.35 * env, 0, 0.55 * env);
                headGroup.rotation.x = 0.25 * env;
            }
            else if (mode === 'spin_tight') {
                const tighten = Math.sin(progress * Math.PI);
                leftArm.rotation.set(-0.12 * tighten, 0, -0.22 * (1 - tighten * 0.5));
                rightArm.rotation.set(-0.12 * tighten, 0, 0.22 * (1 - tighten * 0.5));
                leftElbow.rotation.set(-0.25 * tighten, 0, 0);
                rightElbow.rotation.set(-0.25 * tighten, 0, 0);
                pelvisGroup.rotation.x = -0.10 * tighten;
            }
            else if (mode === 'landing_absorb') {
                const bend = Math.sin(extraAmount * Math.PI);
                bodyMeshGroup.position.y = COM_OFFSET_Y - bend * 0.26;
                pelvisGroup.rotation.x = 0.25 * bend;
                torso.rotation.x = 0.24 * bend;
                leftLeg.rotation.set(-0.75 * bend, 0, 0);
                rightLeg.rotation.set(-0.75 * bend, 0, 0);
                leftKnee.rotation.set(1.35 * bend, 0, 0);
                rightKnee.rotation.set(1.35 * bend, 0, 0);
                leftArm.rotation.set(-0.55 * bend, 0, -1.75);
                rightArm.rotation.set(-0.55 * bend, 0, 1.75);
                leftElbow.rotation.set(-0.25 * bend, 0, 0);
                rightElbow.rotation.set(-0.25 * bend, 0, 0);
            }
            else if (mode === 'landed') {
                leftArm.rotation.set(0, 0, -2.1);
                rightArm.rotation.set(0, 0, 2.1);
            }
        }

        function resetAthlete(keepCombo = false) {
            state = 'idle';
            currentTrick = null;
            trickTime = 0;
            swingTime = 0;
            swingWaypoints = [];
            activeSwingSegment = null;
            currentBarAngle = 0;
            giantCarryoverDir = 0;
            catchImpulseTime = 0;
            catchImpulseStrength = 0;
            facingDir = 1;
            updateFacingBadge();
            updateBarFlex(0);

            if (!keepCombo) {
                isPlayingCombo = false;
                comboIndex = 0;
            }

            if (barPivot) {
                barPivot.rotation.set(0, 0, 0);
                athlete.position.set(0, 0, 0);
                athlete.rotation.set(0, 0, 0);
                bodyMeshGroup.rotation.set(0, 0, 0);
                resetJointsToNeutral();
            }

            updateUIState('אחיזה במתח (Idle)', '-');
        }

        function getDetachedOffsetForBarAngle(angle) {
            const yOffset = COM_OFFSET_Y * (Math.cos(angle) - 1);
            const zOffset = COM_OFFSET_Y * Math.sin(angle);
            return new THREE.Vector3(0, yOffset, zOffset);
        }

        function computeParabolicKinematics(y0, y1, desiredPeakAboveMax, duration) {
            const apexY = Math.max(y0, y1) + desiredPeakAboveMax;
            const dyUp = Math.max(0.08, apexY - y0);
            const dyDown = Math.max(0.08, apexY - y1);

            const tUpIdeal = Math.sqrt((2 * dyUp) / GRAVITY);
            const tDownIdeal = Math.sqrt((2 * dyDown) / GRAVITY);
            const totalIdeal = tUpIdeal + tDownIdeal;

            const timeScale = duration / totalIdeal;
            const effectiveGravity = GRAVITY / (timeScale * timeScale);
            const vy0 = (y1 - y0 + 0.5 * effectiveGravity * duration * duration) / duration;

            return {
                y0,
                y1,
                vy0,
                gravity: effectiveGravity,
                totalTime: duration
            };
        }

        function evaluateParabolicY(kin, t) {
            return kin.y0 + kin.vy0 * t - 0.5 * kin.gravity * t * t;
        }

        function buildSwingSegments(startAngle, targetReleaseAngle, worldSwingDir) {
            const segments = [];
            const sameSideAsRelease = (Math.sign(startAngle) === Math.sign(targetReleaseAngle)) && Math.abs(startAngle) > 0.25;

            if (sameSideAsRelease) {
                const counterSwingAngle = worldSwingDir * 2.35;
                segments.push({
                    from: startAngle,
                    to: counterSwingAngle,
                    duration: 0.72,
                    isLaunchSwing: false,
                    label: 'סווינג ביניים עמוק (בניית תנופה)'
                });
                segments.push({
                    from: counterSwingAngle,
                    to: targetReleaseAngle,
                    duration: 0.76,
                    isLaunchSwing: true,
                    label: 'סווינג שיגור מלא (Whip)'
                });
            } else if (Math.abs(startAngle) <= 0.25) {
                const windupAngle = worldSwingDir * 2.25;
                segments.push({
                    from: startAngle,
                    to: windupAngle,
                    duration: 0.64,
                    isLaunchSwing: false,
                    label: 'הכנת תנופה גבוהה (Arch)'
                });
                segments.push({
                    from: windupAngle,
                    to: targetReleaseAngle,
                    duration: 0.72,
                    isLaunchSwing: true,
                    label: 'תנופת יציאה עמוקה (Hollow Whip)'
                });
            } else {
                segments.push({
                    from: startAngle,
                    to: targetReleaseAngle,
                    duration: 0.68,
                    isLaunchSwing: true,
                    label: 'תנופת יציאה עמוקה (Hollow Whip)'
                });
            }

            return segments;
        }

        function startTrick(trick) {
            if (!isInitialized) initScene();
            if (state === 'landed' || state === 'landing_impact') {
                resetAthlete(isPlayingCombo);
            }

            currentTrick = trick;
            trickTime = 0;

            if (trick.type === 'swing' || trick.type === 'giant') {
                giantCarryoverDir = 0;
                state = 'swinging';
                resetJointsToNeutral();
                updateUIState('תנופה ביומכנית (Swinging)', trick.name);
                return;
            }

            const worldSwingDir = trick.relReleaseDir * facingDir;
            let swingAngleMag = 1.45;
            if (trick.type === 'dismount') {
                swingAngleMag = 1.65;
            } else if (trick.type === 'release') {
                swingAngleMag = 1.55;
            } else if (trick.type === 'spin') {
                const spinBonus = Math.min((trick.degrees / 1260) * 0.45, 0.45);
                swingAngleMag = 1.32 + spinBonus;
            }
            const targetReleaseAngle = -worldSwingDir * swingAngleMag;

            const activeGiantMomentum = giantCarryoverDir;
            giantCarryoverDir = 0;

            if (activeGiantMomentum !== 0) {
                if (activeGiantMomentum === worldSwingDir) {
                    currentBarAngle = targetReleaseAngle;
                    barPivot.rotation.set(currentBarAngle, 0, 0);
                    launchFromSwing();
                    return;
                } else {
                    const entryAngleFromGiant = activeGiantMomentum * 1.45;
                    swingWaypoints = [{
                        from: entryAngleFromGiant,
                        to: targetReleaseAngle,
                        duration: 0.64,
                        isLaunchSwing: true,
                        label: 'מעבר מומנטום מהג\'ייאנט לשיגור'
                    }];
                    activeSwingSegment = swingWaypoints.shift();
                    swingTime = 0;
                    state = 'prep_swing';
                    updateUIState(activeSwingSegment.label, trick.name);
                    return;
                }
            }

            swingWaypoints = buildSwingSegments(currentBarAngle, targetReleaseAngle, worldSwingDir);
            activeSwingSegment = swingWaypoints.shift();
            swingTime = 0;

            state = 'prep_swing';
            updateUIState(activeSwingSegment.label, trick.name);
        }

        function launchFromSwing() {
            releaseAthletePos.copy(getDetachedOffsetForBarAngle(currentBarAngle));
            releasePitchX = currentBarAngle;

            barPivot.rotation.x = 0;
            athlete.position.copy(releaseAthletePos);
            bodyMeshGroup.rotation.x = releasePitchX;
            bodyMeshGroup.rotation.y = facingDir === 1 ? 0 : Math.PI;
            catchImpulseTime = 0;
            updateBarFlex(0);

            const worldSwingDir = currentTrick.relReleaseDir * facingDir;

            if (currentTrick.type === 'spin') {
                catchTargetBarAngle = -worldSwingDir * 0.95;
                catchAthletePos.copy(getDetachedOffsetForBarAngle(catchTargetBarAngle));
                flightKinematics = computeParabolicKinematics(
                    releaseAthletePos.y,
                    catchAthletePos.y,
                    currentTrick.height,
                    currentTrick.duration
                );
            } else if (currentTrick.type === 'release') {
                if (currentTrick.crossBar) {
                    catchTargetBarAngle = worldSwingDir * 1.15;
                } else {
                    catchTargetBarAngle = -worldSwingDir * 1.15;
                }
                catchAthletePos.copy(getDetachedOffsetForBarAngle(catchTargetBarAngle));
                flightKinematics = computeParabolicKinematics(
                    releaseAthletePos.y,
                    catchAthletePos.y,
                    currentTrick.peakHeight,
                    currentTrick.duration
                );
            } else if (currentTrick.type === 'dismount') {
                flightKinematics = computeParabolicKinematics(
                    releaseAthletePos.y,
                    LANDED_ATHLETE_Y,
                    currentTrick.peakHeight,
                    currentTrick.duration
                );
            }

            trickTime = 0;
            if (currentTrick.type === 'dismount') {
                state = 'dismounting';
                updateUIState('ירידה מהמתח (כבידה)', currentTrick.name);
            } else {
                state = 'flying';
                updateUIState('ריחוף באוויר (כבידה)', currentTrick.name);
            }
        }

        function onTrickComplete() {
            const finishedTrick = currentTrick;
            currentTrick = null;
            trickTime = 0;

            if (finishedTrick.type === 'dismount') {
                const worldSwingDir = finishedTrick.relReleaseDir * facingDir;
                const finalLandingZ = worldSwingDir * finishedTrick.dist;

                const isFrontExitFlip = (finishedTrick.relReleaseDir === -1 && finishedTrick.flips > 0) ||
                                        (finishedTrick.relReleaseDir === 1 && finishedTrick.flips < 0);
                const finalYaw = isFrontExitFlip
                    ? (worldSwingDir === 1 ? 0 : Math.PI)
                    : (worldSwingDir === 1 ? Math.PI : 0);

                state = 'landing_impact';
                landingTime = 0;
                barPivot.rotation.set(0, 0, 0);
                bodyMeshGroup.rotation.set(0, finalYaw, 0);
                athlete.rotation.set(0, 0, 0);
                athlete.position.set(0, LANDED_ATHLETE_Y, finalLandingZ);
                setAirBiomechanics('landing_absorb', 1.0, 0);
                updateUIState('בלימת נחיתה (Landing)', finishedTrick.name);
                isPlayingCombo = false;
                return;
            }

            let halfTurns = 0;
            if (finishedTrick.type === 'spin') {
                halfTurns = Math.round(finishedTrick.degrees / 180);
            } else if (finishedTrick.type === 'release') {
                halfTurns = Math.round(finishedTrick.twists * 2);
            }

            if (halfTurns % 2 !== 0) {
                facingDir *= -1;
                updateFacingBadge();
            }

            if (finishedTrick.type === 'release' || finishedTrick.type === 'spin') {
                catchImpulseTime = CATCH_DAMP_DURATION;
                catchImpulseStrength = finishedTrick.type === 'release' ? 1.0 : 0.55;
            }

            if (finishedTrick.type === 'giant') {
                giantCarryoverDir = -finishedTrick.direction * facingDir;
            } else {
                giantCarryoverDir = 0;
            }

            currentBarAngle = (finishedTrick.type === 'spin' || finishedTrick.type === 'release') ? catchTargetBarAngle : 0;
            barPivot.rotation.set(currentBarAngle, 0, 0);
            athlete.position.set(0, 0, 0);
            athlete.rotation.set(0, 0, 0);
            bodyMeshGroup.rotation.set(0, facingDir === 1 ? 0 : Math.PI, 0);
            resetJointsToNeutral();

            if (isPlayingCombo) {
                comboIndex++;
                if (comboIndex < comboQueue.length) {
                    startTrick(comboQueue[comboIndex]);
                    return;
                } else {
                    isPlayingCombo = false;
                }
            }

            state = 'idle';
            updateUIState('אחיזה במתח (Idle)', '-');
        }

        // ==========================================
        // 4. לולאת אנימציה (Animation Loop)
        // ==========================================
        function animate() {
            requestAnimationFrame(animate);
            if (!renderer || !scene || !camera) return;

            const rawDt = Math.min(clock.getDelta(), 0.05);
            const dt = rawDt * slowMoFactor;

            if (state === 'idle') {
                idleTime += dt;
                const targetIdleAngle = Math.sin(idleTime * 2.2) * 0.05;
                const prevAngle = currentBarAngle;
                currentBarAngle = THREE.MathUtils.lerp(currentBarAngle, targetIdleAngle, dt * 3.5);
                const angVel = (currentBarAngle - prevAngle) / Math.max(dt, 0.001);

                barPivot.rotation.x = currentBarAngle;
                bodyMeshGroup.rotation.y = facingDir === 1 ? 0 : Math.PI;
                applySwingBiomechanics(currentBarAngle, THREE.MathUtils.clamp(angVel * 0.25, -1, 1), 0);
                applyCatchImpactOverlay(dt);
            }
            else if (state === 'landing_impact') {
                landingTime += dt;
                const p = Math.min(landingTime / LANDING_ABSORB_DURATION, 1.0);
                setAirBiomechanics('landing_absorb', 1.0, p);
                if (p >= 1.0) {
                    state = 'landed';
                    setAirBiomechanics('landed', 1.0, 1.0);
                    updateUIState('נחיתה מושלמת (Landed)', document.getElementById('current-move-badge').textContent);
                }
            }
            else if (state === 'prep_swing' && currentTrick && activeSwingSegment) {
                swingTime += dt;
                const p = Math.min(swingTime / activeSwingSegment.duration, 1.0);
                const pendulumEase = p < 0.5
                    ? 2 * p * p
                    : 1 - Math.pow(-2 * p + 2, 2) / 2;

                const prevAngle = currentBarAngle;
                currentBarAngle = THREE.MathUtils.lerp(activeSwingSegment.from, activeSwingSegment.to, pendulumEase);
                barPivot.rotation.x = currentBarAngle;

                const angVelNorm = THREE.MathUtils.clamp(((currentBarAngle - prevAngle) / Math.max(dt, 0.001)) * 0.22, -1.2, 1.2);
                const whipSnap = (activeSwingSegment.isLaunchSwing && p > 0.65)
                    ? Math.sin(((p - 0.65) / 0.35) * Math.PI) * Math.sign(activeSwingSegment.to - activeSwingSegment.from)
                    : 0;

                applySwingBiomechanics(currentBarAngle, angVelNorm, whipSnap);
                applyCatchImpactOverlay(dt);

                if (p >= 1.0) {
                    if (swingWaypoints.length > 0) {
                        activeSwingSegment = swingWaypoints.shift();
                        swingTime = 0;
                        updateUIState(activeSwingSegment.label, currentTrick.name);
                    } else {
                        activeSwingSegment = null;
                        launchFromSwing();
                    }
                }
            }
            else if (currentTrick) {
                trickTime += dt;
                const progress = Math.min(trickTime / currentTrick.duration, 1.0);
                const ease = progress < 0.5
                    ? 2 * progress * progress
                    : 1 - Math.pow(-2 * progress + 2, 2) / 2;

                const baseYaw = facingDir === 1 ? 0 : Math.PI;
                const worldSwingDir = (currentTrick.relReleaseDir || 1) * facingDir;

                if (currentTrick.type === 'swing') {
                    const prevAngle = currentBarAngle;
                    currentBarAngle = Math.sin(progress * Math.PI * 2) * currentTrick.amplitude * facingDir;
                    barPivot.rotation.x = currentBarAngle;
                    const angVelNorm = THREE.MathUtils.clamp(((currentBarAngle - prevAngle) / Math.max(dt, 0.001)) * 0.22, -1.2, 1.2);
                    applySwingBiomechanics(currentBarAngle, angVelNorm, 0);
                }
                else if (currentTrick.type === 'giant') {
                    const nextTrick = (isPlayingCombo && comboIndex + 1 < comboQueue.length) ? comboQueue[comboIndex + 1] : null;
                    const giantOutputDir = -currentTrick.direction * facingDir;
                    const nextMatchesGiant = nextTrick && nextTrick.relReleaseDir && ((nextTrick.relReleaseDir * facingDir) === giantOutputDir);

                    if (nextMatchesGiant) {
                        let nextMag = 1.45;
                        if (nextTrick.type === 'dismount') nextMag = 1.65;
                        else if (nextTrick.type === 'release') nextMag = 1.55;
                        else if (nextTrick.type === 'spin') nextMag = 1.32 + Math.min((nextTrick.degrees / 1260) * 0.45, 0.45);

                        const targetNextRelease = -giantOutputDir * nextMag;
                        const totalSweep = (currentTrick.direction * facingDir * Math.PI * 2) + targetNextRelease;
                        const flowCurve = 0.65 * progress + 0.35 * ease;
                        currentBarAngle = flowCurve * totalSweep;
                        barPivot.rotation.x = currentBarAngle;

                        const giantPhase = Math.sin(flowCurve * Math.PI * 2);
                        const whipOut = progress > 0.72 ? Math.sin(((progress - 0.72) / 0.28) * Math.PI) * giantOutputDir : 0;
                        applySwingBiomechanics(giantPhase * 0.7, giantPhase * 0.85, whipOut);
                    } else {
                        currentBarAngle = currentTrick.direction * facingDir * ease * Math.PI * 2;
                        barPivot.rotation.x = currentBarAngle;
                        const giantPhase = Math.sin(ease * Math.PI * 2);
                        applySwingBiomechanics(giantPhase * 0.7, giantPhase * 0.8, 0);
                        if (progress >= 1.0) currentBarAngle = 0;
                    }
                }
                else if (currentTrick.type === 'spin') {
                    setAirBiomechanics('spin_tight', progress);

                    const currentZ = THREE.MathUtils.lerp(releaseAthletePos.z, catchAthletePos.z, progress);
                    const parabolicY = evaluateParabolicY(flightKinematics, trickTime);
                    const outPushZ = worldSwingDir * Math.sin(progress * Math.PI) * 0.26;

                    athlete.position.set(0, parabolicY, currentZ + outPushZ);

                    const targetPitch = catchTargetBarAngle;
                    const pitchEnvelope = Math.sin(progress * Math.PI);
                    const blendedPitch = THREE.MathUtils.lerp(releasePitchX, targetPitch, ease) * (1 - pitchEnvelope * 0.85);
                    bodyMeshGroup.rotation.x = blendedPitch;

                    const totalRad = (currentTrick.degrees * Math.PI) / 180;
                    bodyMeshGroup.rotation.y = baseYaw + ease * totalRad;
                }
                else if (currentTrick.type === 'release') {
                    const currentZ = THREE.MathUtils.lerp(releaseAthletePos.z, catchAthletePos.z, progress);
                    const parabolicY = evaluateParabolicY(flightKinematics, trickTime);

                    if (currentTrick.straddle) {
                        setAirBiomechanics('straddle_dynamic', progress, 1.0);

                        athlete.position.set(0, parabolicY, currentZ);

                        const straddleEnv = Math.sin(progress * Math.PI);
                        const archPitch = -worldSwingDir * 0.22 * straddleEnv;
                        bodyMeshGroup.rotation.x = THREE.MathUtils.lerp(releasePitchX, catchTargetBarAngle, ease) + archPitch;
                        bodyMeshGroup.rotation.y = baseYaw;
                    } else {
                        setAirBiomechanics('tuck_progressive', progress);

                        let extraZ = 0;
                        if (!currentTrick.crossBar) {
                            const outDist = currentTrick.extraOutZ || 0.58;
                            extraZ = worldSwingDir * Math.sin(progress * Math.PI) * outDist;
                        }

                        athlete.position.set(0, parabolicY, currentZ + extraZ);

                        const flipDirection = currentTrick.flips * facingDir;
                        bodyMeshGroup.rotation.x = releasePitchX * (1 - ease) + ease * flipDirection * Math.PI * 2;
                        bodyMeshGroup.rotation.y = baseYaw + ease * currentTrick.twists * Math.PI * 2;
                    }
                }
                else if (currentTrick.type === 'dismount') {
                    const targetZ = worldSwingDir * currentTrick.dist;
                    const currentZ = THREE.MathUtils.lerp(releaseAthletePos.z, targetZ, progress);
                    const parabolicY = evaluateParabolicY(flightKinematics, trickTime);

                    athlete.position.set(0, parabolicY, currentZ);

                    if (currentTrick.tuck === false) {
                        setAirBiomechanics('layout_hollow', progress);
                    } else {
                        setAirBiomechanics('tuck_progressive', progress);
                    }

                    const rotProgress = Math.min(progress / 0.88, 1.0);
                    const rotEase = rotProgress < 0.5
                        ? 2 * rotProgress * rotProgress
                        : 1 - Math.pow(-2 * rotProgress + 2, 2) / 2;

                    const flipSign = currentTrick.flips * facingDir;
                    const isFrontExitFlip = (currentTrick.relReleaseDir === -1 && currentTrick.flips > 0) ||
                                            (currentTrick.relReleaseDir === 1 && currentTrick.flips < 0);
                    const targetEndYaw = isFrontExitFlip
                        ? (worldSwingDir === 1 ? 0 : Math.PI)
                        : (worldSwingDir === 1 ? Math.PI : 0);

                    bodyMeshGroup.rotation.x = releasePitchX * (1 - rotEase) + rotEase * flipSign * Math.PI * 2;
                    bodyMeshGroup.rotation.y = THREE.MathUtils.lerp(baseYaw, targetEndYaw, rotEase) + rotEase * currentTrick.twists * Math.PI * 2;
                }

                if (progress >= 1.0) {
                    onTrickComplete();
                }
            }

            if (cameraMode === 'follow' && bodyMeshGroup) {
                const worldPos = new THREE.Vector3();
                bodyMeshGroup.getWorldPosition(worldPos);
                controls.target.lerp(worldPos, 0.14);
            }

            const { w, h } = getViewportSize();
            if (w !== lastSize.w || h !== lastSize.h) {
                lastSize = { w, h };
                camera.aspect = w / h;
                camera.updateProjectionMatrix();
                renderer.setSize(w, h, false);
            }

            controls.update();
            renderer.render(scene, camera);
        }

        // ==========================================
        // 5. ממשק משתמש וניהול קומבואים (UI & Combo Logic)
        // ==========================================
        function switchTab(tabName) {
            activeTab = tabName;
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('bg-blue-600', 'text-white');
                btn.classList.add('bg-slate-800', 'text-slate-300');
            });
            const activeBtn = document.getElementById(`tab-${tabName}`);
            activeBtn.classList.remove('bg-slate-800', 'text-slate-300');
            activeBtn.classList.add('bg-blue-600', 'text-white');

            renderTricks();
        }

        function renderTricks() {
            const grid = document.getElementById('tricks-container');
            grid.innerHTML = '';

            TRICKS[activeTab].forEach(trick => {
                const card = document.createElement('div');
                card.className = 'group relative flex items-center justify-between bg-slate-800/90 hover:bg-slate-700/90 border border-slate-700 hover:border-cyan-500/60 rounded-xl px-2 py-1.5 transition cursor-pointer';
                
                card.onclick = () => {
                    isPlayingCombo = false;
                    startTrick(trick);
                };

                card.innerHTML = `
                    <div class="pr-0.5 min-w-0">
                        <div class="text-[11px] font-bold text-slate-100 group-hover:text-cyan-300 transition truncate">${trick.name}</div>
                        <div class="text-[9px] text-slate-400 truncate">${trick.sub}</div>
                    </div>
                    <button type="button" title="הוסף לרצף" class="w-6 h-6 rounded-md bg-slate-900/90 hover:bg-cyan-600 text-cyan-400 hover:text-white font-bold text-xs flex items-center justify-center border border-slate-700 transition shrink-0 mr-1 cursor-pointer">
                        +
                    </button>
                `;

                const addBtn = card.querySelector('button');
                addBtn.onclick = (e) => {
                    e.stopPropagation();
                    addToCombo(trick);
                };

                grid.appendChild(card);
            });
        }

        function toggleTricksPanelSize() {
            isTricksExpanded = !isTricksExpanded;
            const panel = document.getElementById('tricks-panel');
            const grid = document.getElementById('tricks-container');
            const icon = document.getElementById('toggle-tricks-icon');
            const text = document.getElementById('toggle-tricks-text');

            if (isTricksExpanded) {
                panel.classList.remove('max-w-md', 'p-2.5');
                panel.classList.add('max-w-3xl', 'p-4');
                grid.classList.remove('max-h-[88px]', 'sm:grid-cols-3');
                grid.classList.add('max-h-[240px]', 'sm:grid-cols-3', 'md:grid-cols-4');
                icon.textContent = '⤡';
                text.textContent = 'הקטן';
            } else {
                panel.classList.remove('max-w-3xl', 'p-4', 'md:grid-cols-4');
                panel.classList.add('max-w-md', 'p-2.5');
                grid.classList.remove('max-h-[240px]', 'md:grid-cols-4');
                grid.classList.add('max-h-[88px]', 'sm:grid-cols-3');
                icon.textContent = '⤢';
                text.textContent = 'הגדל';
            }
        }

        function addToCombo(trick) {
            comboQueue.push(trick);
            renderComboQueue();
        }

        function removeFromCombo(index) {
            comboQueue.splice(index, 1);
            renderComboQueue();
        }

        function clearCombo() {
            comboQueue = [];
            isPlayingCombo = false;
            renderComboQueue();
        }

        function renderComboQueue() {
            const list = document.getElementById('combo-list');
            const playBtn = document.getElementById('btn-play-combo');

            if (comboQueue.length === 0) {
                list.innerHTML = '<span class="text-xs text-slate-500 italic">לחץ על + ליד תרגילים כדי לבנות רצף...</span>';
                playBtn.disabled = true;
                return;
            }

            playBtn.disabled = false;
            list.innerHTML = '';

            comboQueue.forEach((trick, idx) => {
                const pill = document.createElement('span');
                pill.className = 'inline-flex items-center gap-1.5 px-2 py-0.5 rounded-lg text-[11px] font-medium bg-cyan-950/90 text-cyan-200 border border-cyan-700/60';
                pill.innerHTML = `
                    <span>${idx + 1}. ${trick.name}</span>
                    <button type="button" class="text-cyan-400 hover:text-rose-400 font-bold ml-0.5 cursor-pointer">&times;</button>
                `;
                pill.querySelector('button').onclick = () => removeFromCombo(idx);
                list.appendChild(pill);
            });
        }

        function playCombo() {
            if (comboQueue.length === 0) return;
            isPlayingCombo = true;
            comboIndex = 0;
            startTrick(comboQueue[0]);
        }

        function setCameraView(view) {
            cameraMode = view;
            const followBtn = document.getElementById('btn-follow');
            followBtn.classList.remove('bg-blue-600', 'text-white');

            if (view === 'side') {
                controls.target.set(0, 3.6, 0);
                camera.position.set(11.5, 4.2, 0);
            } else if (view === 'threeQuarter') {
                controls.target.set(0, 3.6, 0);
                camera.position.set(9.2, 4.8, 7.2);
            } else if (view === 'follow') {
                followBtn.classList.add('bg-blue-600', 'text-white');
            }
        }

        function toggleSlowMo() {
            const btn = document.getElementById('btn-slowmo');
            if (slowMoFactor === 1.0) {
                slowMoFactor = 0.5;
                btn.textContent = 'הילוך איטי: 0.5x';
                btn.classList.add('border-amber-500', 'text-amber-300');
            } else if (slowMoFactor === 0.5) {
                slowMoFactor = 0.25;
                btn.textContent = 'הילוך איטי: 0.25x';
            } else {
                slowMoFactor = 1.0;
                btn.textContent = 'הילוך איטי: 1.0x';
                btn.classList.remove('border-amber-500', 'text-amber-300');
            }
        }

        function handleResize() {
            if (!camera || !renderer) return;
            const { w, h } = getViewportSize();
            if (w > 0 && h > 0) {
                lastSize = { w, h };
                camera.aspect = w / h;
                camera.updateProjectionMatrix();
                renderer.setSize(w, h, false);
            }
        }

        window.addEventListener('resize', handleResize);
        window.addEventListener('DOMContentLoaded', () => {
            renderTricks();
            renderComboQueue();
            initScene();
        });
        window.addEventListener('load', () => {
            initScene();
            handleResize();
        });

        renderTricks();
        renderComboQueue();
        initScene();
    </script>
</body>
</html>
