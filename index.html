<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>סימולטור קליסטניקס תלת-ממדי - ביומכניקה מתקדמת (3D Calisthenics Simulator)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b1120;
            font-family: system-ui, -apple-system, sans-serif;
        }
        #canvas-container {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: auto;
            touch-action: none;
        }
        #canvas-container canvas {
            display: block;
            width: 100% !important;
            height: 100% !important;
            outline: none;
        }
        .glass-panel {
            background: rgba(15, 23, 42, 0.86);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.14);
        }
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.2); }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.25); border-radius: 3px; }
    </style>
</head>
<body class="text-slate-100 select-none">

    <!-- 3D Canvas Container -->
    <div id="canvas-container"></div>

    <!-- Top Status & Controls Header -->
    <div class="fixed top-3 left-3 right-3 z-20 flex flex-wrap items-center justify-between gap-2 pointer-events-none">
        <!-- Title & State Badge -->
        <div class="glass-panel rounded-2xl px-3.5 py-2.5 flex flex-wrap items-center gap-3 pointer-events-auto shadow-xl">
            <div>
                <h1 class="text-base sm:text-lg font-bold bg-gradient-to-l from-cyan-400 to-blue-500 bg-clip-text text-transparent">
                    סימולטור פריסטייל וסטטי 3D
                </h1>
                <p class="text-[11px] text-slate-400">ביומכניקה מלאה • IK זרועות, כבידה וגמישות מוט</p>
            </div>
            <div class="h-7 w-px bg-slate-700 hidden sm:block"></div>
            <div class="flex flex-col">
                <span class="text-[10px] uppercase tracking-wider text-slate-400">מצב נוכחי</span>
                <span id="state-badge" class="text-xs sm:text-sm font-semibold text-emerald-400">אחיזה במתח (Idle)</span>
            </div>
            <div class="flex flex-col">
                <span class="text-[10px] uppercase tracking-wider text-slate-400">תרגיל פעיל</span>
                <span id="current-move-badge" class="text-xs sm:text-sm font-semibold text-cyan-300">-</span>
            </div>
            <div class="flex flex-col">
                <span class="text-[10px] uppercase tracking-wider text-slate-400">כיוון מבט</span>
                <span id="facing-badge" class="text-xs font-bold text-amber-300">קדימה (+Z)</span>
            </div>
        </div>

        <!-- Camera & Speed Controls -->
        <div class="glass-panel rounded-2xl px-3 py-2 flex flex-wrap items-center gap-1.5 pointer-events-auto shadow-xl">
            <button type="button" onclick="setCameraView('side')" class="px-2.5 py-1.5 rounded-lg text-xs font-medium bg-slate-800 hover:bg-slate-700 border border-slate-700 transition cursor-pointer">מבט צד</button>
            <button type="button" onclick="setCameraView('threeQuarter')" class="px-2.5 py-1.5 rounded-lg text-xs font-medium bg-slate-800 hover:bg-slate-700 border border-slate-700 transition cursor-pointer">3/4 דינמי</button>
            <button type="button" onclick="setCameraView('follow')" id="btn-follow" class="px-2.5 py-1.5 rounded-lg text-xs font-medium bg-slate-800 hover:bg-slate-700 border border-slate-700 transition cursor-pointer">מעקב אתלט</button>
            <div class="h-5 w-px bg-slate-700 mx-0.5"></div>
            <button type="button" onclick="toggleSlowMo()" id="btn-slowmo" class="px-2.5 py-1.5 rounded-lg text-xs font-medium bg-slate-800 hover:bg-slate-700 border border-slate-700 transition cursor-pointer">הילוך איטי: 1.0x</button>
            <button type="button" onclick="resetAthlete()" class="px-2.5 py-1.5 rounded-lg text-xs font-bold bg-rose-600/85 hover:bg-rose-500 text-white transition cursor-pointer">איפוס למתח</button>
        </div>
    </div>

    <!-- Bottom Controls & Combo Queue -->
    <div class="fixed bottom-3 left-3 right-3 z-20 flex flex-col lg:flex-row items-stretch lg:items-end justify-between gap-2.5 pointer-events-none">
        
        <!-- Tricks Selection Panel -->
        <div id="tricks-panel" class="glass-panel rounded-2xl p-2.5 pointer-events-auto shadow-2xl max-w-xl w-full transition-all duration-300">
            <!-- Category Tabs & Expand Toggle -->
            <div class="flex flex-wrap items-center justify-between gap-1.5 mb-2 border-b border-slate-700/80 pb-1.5">
                <div class="flex flex-wrap gap-1">
                    <button type="button" onclick="switchTab('swing')" id="tab-swing" class="tab-btn px-2 py-1 rounded-lg text-[11px] font-bold bg-blue-600 text-white transition cursor-pointer">תנופה</button>
                    <button type="button" onclick="switchTab('spins')" id="tab-spins" class="tab-btn px-2 py-1 rounded-lg text-[11px] font-bold bg-slate-800 text-slate-300 hover:bg-slate-700 transition cursor-pointer">סיבובים</button>
                    <button type="button" onclick="switchTab('releases')" id="tab-releases" class="tab-btn px-2 py-1 rounded-lg text-[11px] font-bold bg-slate-800 text-slate-300 hover:bg-slate-700 transition cursor-pointer">עזיבות</button>
                    <button type="button" onclick="switchTab('dismounts')" id="tab-dismounts" class="tab-btn px-2 py-1 rounded-lg text-[11px] font-bold bg-slate-800 text-slate-300 hover:bg-slate-700 transition cursor-pointer">ירידות</button>
                    <button type="button" onclick="switchTab('statics')" id="tab-statics" class="tab-btn px-2 py-1 rounded-lg text-[11px] font-bold bg-slate-800 text-purple-300 hover:bg-slate-700 transition cursor-pointer">סטטי</button>
                    <button type="button" onclick="switchTab('strength')" id="tab-strength" class="tab-btn px-2 py-1 rounded-lg text-[11px] font-bold bg-slate-800 text-amber-300 hover:bg-slate-700 transition cursor-pointer">דינאמי כוח</button>
                </div>
                <button type="button" onclick="toggleTricksPanelSize()" id="btn-toggle-tricks" class="px-2.5 py-1 rounded-lg text-[11px] font-bold bg-slate-800 hover:bg-cyan-700/70 text-cyan-300 border border-slate-600 transition flex items-center gap-1 shrink-0 cursor-pointer">
                    <span id="toggle-tricks-icon">⤢</span>
                    <span id="toggle-tricks-text">הגדל</span>
                </button>
            </div>

            <!-- Static Exit Mode Selector -->
            <div class="flex flex-wrap items-center justify-between gap-2 mb-2 px-1.5 py-1 rounded-lg bg-slate-900/70 border border-slate-800 text-[11px]">
                <span class="text-slate-400 font-medium">יציאה מסטטי / כוח:</span>
                <div class="flex items-center gap-1.5">
                    <button type="button" onclick="setStaticExitMode('drop')" id="btn-exit-drop" class="px-2 py-0.5 rounded bg-purple-600 text-white font-bold transition cursor-pointer">ירידה מבוקרת</button>
                    <button type="button" onclick="setStaticExitMode('swing')" id="btn-exit-swing" class="px-2 py-0.5 rounded bg-slate-800 text-slate-300 hover:bg-slate-700 font-bold transition cursor-pointer">המשך לסווינג (Cast)</button>
                </div>
            </div>

            <!-- Tricks Grid -->
            <div id="tricks-container" class="grid grid-cols-2 sm:grid-cols-3 gap-1.5 max-h-[96px] overflow-y-auto pr-1 transition-all duration-300">
                <!-- Populated by JS -->
            </div>
        </div>

        <!-- Combo Builder Panel -->
        <div class="glass-panel rounded-2xl p-3 pointer-events-auto shadow-2xl w-full lg:w-88 xl:w-96 flex flex-col justify-between">
            <div class="flex items-center justify-between mb-1.5">
                <span class="text-xs font-bold text-slate-200">בניית רצף (Combo Queue)</span>
                <button type="button" onclick="clearCombo()" class="text-[11px] text-rose-400 hover:text-rose-300 cursor-pointer">נקה רצף</button>
            </div>
            
            <div id="combo-list" class="flex flex-wrap gap-1.5 min-h-[38px] max-h-[76px] overflow-y-auto bg-slate-950/60 rounded-xl p-2 border border-slate-800 mb-2.5 items-center">
                <span class="text-xs text-slate-500 italic">לחץ על + ליד תרגילים כדי לבנות רצף...</span>
            </div>

            <button type="button" onclick="playCombo()" id="btn-play-combo" class="w-full py-2 rounded-xl font-bold text-sm bg-gradient-to-l from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-white shadow-lg transition disabled:opacity-40 disabled:cursor-not-allowed cursor-pointer">
                ▶ בצע רצף תרגילים
            </button>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. מאגר התרגילים (Tricks Database)
        // ==========================================
        const TRICKS = {
            swing: [
                { id: 'tap_swing', name: 'Tap Swing', sub: 'הצלפת Arch-to-Hollow עמוקה', type: 'swing', duration: 1.56, amplitude: 2.35 },
                { id: 'giant_back', name: 'Back Giant', sub: 'סיבוב מלא אחורה', type: 'giant', direction: 1, duration: 1.50 },
                { id: 'giant_front', name: 'Front Giant', sub: 'סיבוב מלא קדימה', type: 'giant', direction: -1, duration: 1.50 }
            ],
            spins: [
                { id: 'spin_180', name: '180 Spin', sub: 'סווינג קדימה (+Z יחסי)', type: 'spin', relReleaseDir: 1, degrees: 180, height: 0.44, duration: 0.74 },
                { id: 'spin_360', name: '360 Spin', sub: 'סווינג אחורה (-Z יחסי)', type: 'spin', relReleaseDir: -1, degrees: 360, height: 0.50, duration: 0.80 },
                { id: 'spin_540', name: '540 Spin', sub: 'סווינג קדימה (+Z יחסי)', type: 'spin', relReleaseDir: 1, degrees: 540, height: 0.56, duration: 0.86 },
                { id: 'spin_720', name: '720 Spin', sub: 'סווינג אחורה (-Z יחסי)', type: 'spin', relReleaseDir: -1, degrees: 720, height: 0.62, duration: 0.94 },
                { id: 'spin_900', name: '900 Spin', sub: 'סווינג קדימה (+Z יחסי)', type: 'spin', relReleaseDir: 1, degrees: 900, height: 0.68, duration: 1.04 },
                { id: 'spin_1080', name: '1080 Spin', sub: 'סווינג אחורה (-Z יחסי)', type: 'spin', relReleaseDir: -1, degrees: 1080, height: 0.74, duration: 1.14 },
                { id: 'spin_1260', name: '1260 Spin', sub: 'סווינג קדימה (+Z יחסי)', type: 'spin', relReleaseDir: 1, degrees: 1260, height: 0.80, duration: 1.24 }
            ],
            releases: [
                { id: 'gienger', name: 'Gienger', sub: 'סווינג קדימה • Tucked • 180', type: 'release', crossBar: false, relReleaseDir: 1, flips: -1, twists: 0.5, peakHeight: 1.12, duration: 1.10 },
                { id: 'frisbee', name: 'Frisbee', sub: 'סווינג אחורה • Tucked • 360', type: 'release', crossBar: false, relReleaseDir: -1, flips: -1, twists: 1.0, peakHeight: 1.22, duration: 1.14 },
                { id: 'tkatchev', name: 'Straddle Tkatchev', sub: 'מעבר מעל המתח • פיסוק רגליים', type: 'release', crossBar: true, straddle: true, relReleaseDir: 1, flips: 0, twists: 0, peakHeight: 1.38, duration: 1.06 },
                { id: 'iceball_regrab', name: 'Iceball Regrab', sub: 'סווינג אחורה • סלטה קדמית + תפיסה', type: 'release', crossBar: false, relReleaseDir: -1, flips: 1, twists: 0, peakHeight: 1.48, extraOutZ: 0.68, duration: 1.12 },
                { id: 'b2b_regrab', name: 'B2B Regrab', sub: 'סווינג אחורה • סלטה אחורית + תפיסה', type: 'release', crossBar: false, relReleaseDir: -1, flips: -1, twists: 0, peakHeight: 1.48, extraOutZ: 0.68, duration: 1.12 },
                { id: 'fireball_regrab', name: 'Fireball Regrab', sub: 'סווינג קדימה • סלטה קדמית + תפיסה', type: 'release', crossBar: false, relReleaseDir: 1, flips: 1, twists: 0, peakHeight: 1.48, extraOutZ: 0.68, duration: 1.12 }
            ],
            dismounts: [
                { id: 'b2b', name: 'B2B', sub: 'סווינג אחורה (-Z יחסי)', type: 'dismount', relReleaseDir: -1, flips: -1, twists: 0, tuck: true, dist: 3.3, peakHeight: 0.95, duration: 1.18 },
                { id: 'layout_b2b', name: 'Layout B2B', sub: 'סווינג אחורה • גוף ישר', type: 'dismount', relReleaseDir: -1, flips: -1, twists: 0, tuck: false, dist: 3.8, peakHeight: 1.1, duration: 1.22 },
                { id: '360_b2b', name: '360 B2B', sub: 'סווינג אחורה • בורג 360', type: 'dismount', relReleaseDir: -1, flips: -1, twists: 1, tuck: true, dist: 3.6, peakHeight: 1.15, duration: 1.25 },
                { id: 'iceball', name: 'Iceball', sub: 'סווינג אחורה • סלטה קדמית', type: 'dismount', relReleaseDir: -1, flips: 1, twists: 0, tuck: true, dist: 3.4, peakHeight: 1.05, duration: 1.18 },
                { id: 'gainer', name: 'Gainer', sub: 'סווינג קדימה (+Z יחסי)', type: 'dismount', relReleaseDir: 1, flips: -1, twists: 0, tuck: true, dist: 3.3, peakHeight: 0.95, duration: 1.18 },
                { id: 'layout_gainer', name: 'Layout Gainer', sub: 'סווינג קדימה • גוף ישר', type: 'dismount', relReleaseDir: 1, flips: -1, twists: 0, tuck: false, dist: 3.8, peakHeight: 1.1, duration: 1.22 },
                { id: 'full_twist_gainer', name: 'Full Twist Gainer', sub: 'סווינג קדימה • בורג 360', type: 'dismount', relReleaseDir: 1, flips: -1, twists: 1, tuck: true, dist: 3.6, peakHeight: 1.15, duration: 1.25 },
                { id: 'fireball', name: 'Fireball', sub: 'סווינג קדימה • סלטה קדמית', type: 'dismount', relReleaseDir: 1, flips: 1, twists: 0, tuck: true, dist: 3.4, peakHeight: 1.05, duration: 1.18 }
            ],
            statics: [
                { id: 'front_lever', name: 'Front Lever', sub: 'החזקה אופקית מתחת למוט', type: 'static', zone: 'hanging', pose: 'front_lever', duration: 2.3 },
                { id: 'one_arm_fl', name: 'One-Arm Front Lever', sub: 'פרונט לבר ביד אחת', type: 'static', zone: 'hanging', pose: 'one_arm_fl', duration: 2.3 },
                { id: 'back_lever', name: 'Back Lever', sub: 'החזקה אופקית הפוכה מתחת למוט', type: 'static', zone: 'hanging', pose: 'back_lever', duration: 2.3 },
                { id: 'victorian', name: 'Victorian', sub: 'החזקה אופקית בגובה המוט', type: 'static', zone: 'hanging', pose: 'victorian', duration: 2.3 },
                { id: 'full_planche', name: 'Full Planche', sub: 'פלאנש מלא מעל המוט', type: 'static', zone: 'top', pose: 'full_planche', duration: 2.3 },
                { id: 'maltese', name: 'Maltese', sub: 'אחיזה רחבה בגובה המוט (Flare)', type: 'static', zone: 'top', pose: 'maltese', duration: 2.4 },
                { id: 'handstand', name: 'Handstand', sub: 'עמידת ידיים מלאה מעל המוט', type: 'static', zone: 'top', pose: 'handstand', duration: 2.3 },
                { id: 'v_sit', name: 'L-Sit / V-Sit', sub: 'ישיבת כוח חדה מעל המוט', type: 'static', zone: 'top', pose: 'v_sit', duration: 2.3 }
            ],
            strength: [
                { id: 'olympic_mu', name: 'Olympic Muscle-Up', sub: 'עליית כוח קשתית מתפרצת', type: 'strength', zone: 'transition_up', pose: 'olympic_mu', duration: 1.15 },
                { id: 'fl_pullups', name: 'Front Lever Pull-Ups', sub: 'מתח בפרונט לבר (2 חזרות)', type: 'strength', zone: 'hanging', pose: 'fl_pullups', duration: 2.4 },
                { id: 'fl_presses', name: 'Front Lever Presses', sub: 'לחיצות מתלייה לפרונט לבר והיפוך', type: 'strength', zone: 'hanging', pose: 'fl_presses', duration: 2.4 },
                { id: 'bl_pullups', name: 'Back Lever Pull-Ups', sub: 'משיכות ממצב באק לבר (2 חזרות)', type: 'strength', zone: 'hanging', pose: 'bl_pullups', duration: 2.4 },
                { id: 'bl_presses', name: 'Back Lever Presses', sub: 'לחיצות מתלייה הפוכה לבאק לבר', type: 'strength', zone: 'hanging', pose: 'bl_presses', duration: 2.4 },
                { id: 'planche_pushups', name: 'Planche Push-Ups', sub: 'שכיבות סמיכה בפלאנש (2 חזרות)', type: 'strength', zone: 'top', pose: 'planche_pushups', duration: 2.4 },
                { id: 'planche_presses', name: 'Planche Presses', sub: 'פלאנש לעמידת ידיים וחזרה', type: 'strength', zone: 'top', pose: 'planche_presses', duration: 2.5 },
                { id: 'maltese_presses', name: 'Maltese Presses', sub: 'הרמה ממלטז לעמידת ידיים', type: 'strength', zone: 'top', pose: 'maltese_presses', duration: 2.5 },
                { id: 'vsit_to_hs', name: 'V-Sit to Handstand', sub: 'מננה פרס לעמידת ידיים מלאה', type: 'strength', zone: 'top', pose: 'vsit_to_hs', duration: 2.4 }
            ]
        };

        // ==========================================
        // 2. משתנים גלובליים והגדרות סצנה
        // ==========================================
        let scene, camera, renderer, controls;
        let highBarMesh, barPivot, athlete, bodyMeshGroup;
        let leftArm, rightArm, leftElbow, rightElbow;
        let torso, pelvisGroup, headGroup;
        let leftLeg, rightLeg, leftKnee, rightKnee;

        const BAR_HEIGHT = 5.0;
        const MAT_HEIGHT = 0.35;
        const ATHLETE_HEIGHT = 1.85;
        const COM_OFFSET_Y = -0.95;
        const LANDED_ATHLETE_Y = -(BAR_HEIGHT - MAT_HEIGHT - ATHLETE_HEIGHT); // -2.80
        const GRAVITY = 12.2;

        // קבועים אנטומיים מדויקים ל-IK
        const UPPER_ARM_LEN = 0.27;
        const FOREARM_LEN = 0.30;
        const SHOULDER_OFFSET_X = 0.23;
        const SHOULDER_OFFSET_Y = 0.38;
        const TOP_SUPPORT_Y = 0.16;

        let state = 'idle';
        let currentTrick = null;
        let trickTime = 0;
        let slowMoFactor = 1.0;
        let cameraMode = 'threeQuarter';
        let facingDir = 1;
        let staticExitMode = 'drop'; // 'drop' | 'swing'

        let currentBarAngle = 0;
        let swingWaypoints = [];
        let activeSwingSegment = null;
        let swingTime = 0;
        let giantCarryoverDir = 0;

        // מצב כניסה ויציאה לסטטי/כוח
        let staticZoneState = 'hanging'; // 'hanging' | 'top'
        let staticEntryPose = { y: 0, z: 0, pitch: 0, gripHalf: SHOULDER_OFFSET_X };
        let staticCurrentPose = { y: 0, z: 0, pitch: 0, gripHalf: SHOULDER_OFFSET_X };
        let pendingTopTrick = null;
        let flCastCarryover = false;

        let releaseAthletePos = new THREE.Vector3();
        let releasePitchX = 0;
        let catchAthletePos = new THREE.Vector3();
        let catchTargetBarAngle = 0;
        let flightKinematics = { y0: 0, y1: 0, vy0: 0, gravity: GRAVITY, totalTime: 1.0 };

        let catchImpulseTime = 0;
        let catchImpulseStrength = 0;
        const CATCH_DAMP_DURATION = 0.42;

        let landingTime = 0;
        const LANDING_ABSORB_DURATION = 0.46;

        let comboQueue = [];
        let isPlayingCombo = false;
        let comboIndex = 0;
        let idleTime = 0;
        let activeTab = 'swing';
        let isTricksExpanded = false;
        let isInitialized = false;
        let lastSize = { w: 0, h: 0 };
        let clock;

        function getViewportSize() {
            const container = document.getElementById('canvas-container');
            const rect = container ? container.getBoundingClientRect() : null;
            const w = Math.max(
                rect && rect.width ? Math.round(rect.width) : 0,
                window.innerWidth || 0,
                document.documentElement.clientWidth || 0,
                800
            );
            const h = Math.max(
                rect && rect.height ? Math.round(rect.height) : 0,
                window.innerHeight || 0,
                document.documentElement.clientHeight || 0,
                600
            );
            return { w, h };
        }

        function initScene() {
            if (isInitialized) return;
            if (typeof THREE === 'undefined') {
                setTimeout(initScene, 50);
                return;
            }

            const container = document.getElementById('canvas-container');
            if (!container) return;

            try {
                isInitialized = true;
                const { w, h } = getViewportSize();
                lastSize = { w, h };

                scene = new THREE.Scene();
                scene.background = new THREE.Color(0x0b1120);
                scene.fog = new THREE.FogExp2(0x0b1120, 0.017);

                camera = new THREE.PerspectiveCamera(48, w / h, 0.1, 100);
                camera.position.set(9.2, 4.8, 7.2);

                renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
                renderer.setSize(w, h, false);
                renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
                renderer.shadowMap.enabled = true;
                renderer.shadowMap.type = THREE.PCFSoftShadowMap;
                container.innerHTML = '';
                container.appendChild(renderer.domElement);

                controls = new THREE.OrbitControls(camera, renderer.domElement);
                controls.target.set(0, 3.6, 0);
                controls.enableDamping = true;
                controls.dampingFactor = 0.06;
                controls.maxPolarAngle = Math.PI / 2 - 0.02;
                controls.minDistance = 2.5;
                controls.maxDistance = 26;

                const ambientLight = new THREE.AmbientLight(0xdbeafe, 0.72);
                scene.add(ambientLight);

                const mainLight = new THREE.DirectionalLight(0xffffff, 1.18);
                mainLight.position.set(8, 16, 10);
