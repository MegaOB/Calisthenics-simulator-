        // ==========================================
        // 3. פותר IK דו-מפרקי אנליטי לנעילת ידיים על המוט
        // ==========================================
        function solveTwoBoneArmIK(shoulderGroup, elbowGroup, targetLocalPos, poleLocalDir) {
            const origin = shoulderGroup.position.clone();
            const toTarget = targetLocalPos.clone().sub(origin);
            const rawDist = toTarget.length();
            if (rawDist < 1e-4) return;

            const L1 = UPPER_ARM_LEN;
            const L2 = FOREARM_LEN;
            const maxReach = (L1 + L2) * 0.996;
            const minReach = Math.abs(L1 - L2) + 0.02;
            const d = THREE.MathUtils.clamp(rawDist, minReach, maxReach);

            const dir = toTarget.clone().normalize();
            let pole = poleLocalDir.clone().sub(dir.clone().multiplyScalar(poleLocalDir.dot(dir)));
            if (pole.lengthSq() < 1e-5) {
                pole.set(0, 0, -1);
                pole.sub(dir.clone().multiplyScalar(pole.dot(dir)));
            }
            pole.normalize();

            const cosShoulder = THREE.MathUtils.clamp((L1 * L1 + d * d - L2 * L2) / (2 * L1 * d), -1, 1);
            const sinShoulder = Math.sqrt(Math.max(0, 1 - cosShoulder * cosShoulder));
            const upperDir = dir.clone().multiplyScalar(cosShoulder).add(pole.clone().multiplyScalar(sinShoulder)).normalize();

            const elbowPos = origin.clone().add(upperDir.clone().multiplyScalar(L1));
            const forearmDir = targetLocalPos.clone().sub(elbowPos).normalize();

            const yAxis = new THREE.Vector3(0, 1, 0);
            const qUpper = new THREE.Quaternion().setFromUnitVectors(yAxis, upperDir);
            shoulderGroup.quaternion.copy(qUpper);

            const localForearmDir = forearmDir.clone().applyQuaternion(qUpper.clone().invert()).normalize();
            const qForearm = new THREE.Quaternion().setFromUnitVectors(yAxis, localForearmDir);
            elbowGroup.quaternion.copy(qForearm);
        }

        function lockHandsToBar(gripHalfWidth = SHOULDER_OFFSET_X, customLeftPole = null, customRightPole = null) {
            bodyMeshGroup.updateMatrix();
            const invBodyMat = new THREE.Matrix4().copy(bodyMeshGroup.matrix).invert();

            const leftHandBar = new THREE.Vector3(-gripHalfWidth, 0, 0).applyMatrix4(invBodyMat);
            const rightHandBar = new THREE.Vector3(gripHalfWidth, 0, 0).applyMatrix4(invBodyMat);

            const defaultLeftPole = customLeftPole || new THREE.Vector3(-0.22, -0.35, -0.90).normalize();
            const defaultRightPole = customRightPole || new THREE.Vector3(0.22, -0.35, -0.90).normalize();

            solveTwoBoneArmIK(leftArm, leftElbow, leftHandBar, defaultLeftPole);
            solveTwoBoneArmIK(rightArm, rightElbow, rightHandBar, defaultRightPole);
        }

        // ==========================================
        // 4. ביומכניקת תרגילי סטטי ודינאמי כוח
        // ==========================================
        function getStaticPoseParams(poseName, p, tremor) {
            let y = COM_OFFSET_Y;
            let z = 0;
            let pitch = 0;
            let gripHalf = SHOULDER_OFFSET_X;
            let leftPole = new THREE.Vector3(-0.22, -0.35, -0.90).normalize();
            let rightPole = new THREE.Vector3(0.22, -0.35, -0.90).normalize();

            resetJointsToNeutral();

            if (poseName === 'front_lever') {
                y = -0.56 + tremor * 0.008;
                z = 0.08 * facingDir;
                pitch = -(Math.PI / 2) * facingDir + tremor * 0.015;
                headGroup.rotation.x = 0.22;
                pelvisGroup.rotation.x = -0.04;
            }
            else if (poseName === 'one_arm_fl') {
                y = -0.56 + tremor * 0.01;
                z = 0.08 * facingDir;
                pitch = -(Math.PI / 2) * facingDir + tremor * 0.02;
                headGroup.rotation.x = 0.25;
                torso.rotation.y = 0.14 * facingDir;
            }
            else if (poseName === 'back_lever') {
                y = -0.54 + tremor * 0.008;
                z = -0.10 * facingDir;
                pitch = (Math.PI / 2) * facingDir + tremor * 0.015;
                headGroup.rotation.x = -0.25;
                pelvisGroup.rotation.x = 0.05;
                leftPole.set(-0.25, 0.45, -0.85).normalize();
                rightPole.set(0.25, 0.45, -0.85).normalize();
            }
            else if (poseName === 'victorian') {
                y = 0.02 + tremor * 0.008;
                z = -0.16 * facingDir;
                pitch = -(Math.PI / 2) * facingDir + tremor * 0.015;
                gripHalf = 0.34;
                headGroup.rotation.x = 0.20;
                leftPole.set(-0.25, -0.60, -0.75).normalize();
                rightPole.set(0.25, -0.60, -0.75).normalize();
            }
            else if (poseName === 'full_planche') {
                // הגבהת האגן מעל המוט כדי למנוע מגע או חיתוך עם המתח
                y = 0.36 + tremor * 0.008;
                z = 0.30 * facingDir;
                pitch = (Math.PI / 2) * facingDir + tremor * 0.015;
                headGroup.rotation.x = -0.45;
                pelvisGroup.rotation.x = -0.06;
                leftPole.set(-0.25, -0.75, -0.60).normalize();
                rightPole.set(0.25, -0.75, -0.60).normalize();
            }
            else if (poseName === 'maltese') {
                const flarePhase = Math.min(p / 0.26, 1.0);
                const flareEase = 1 - Math.pow(1 - flarePhase, 3);
                gripHalf = THREE.MathUtils.lerp(SHOULDER_OFFSET_X, 0.52, flareEase);
                // שמירה על מרווח ברור מעל המוט גם במלטיז
                y = THREE.MathUtils.lerp(0.32, 0.22, flareEase) + tremor * 0.008;
                z = THREE.MathUtils.lerp(0.26, 0.16, flareEase) * facingDir;
                pitch = (Math.PI / 2) * facingDir + tremor * 0.015;
                headGroup.rotation.x = -0.42;
                leftPole.set(-0.45, -0.75, -0.45).normalize();
                rightPole.set(0.45, -0.75, -0.45).normalize();
            }
            else if (poseName === 'handstand') {
                y = 0.94 + tremor * 0.006;
                z = 0.02 * facingDir;
                pitch = Math.PI * facingDir + tremor * 0.01;
                headGroup.rotation.x = -0.48;
            }
            else if (poseName === 'v_sit') {
                y = 0.58 + tremor * 0.007;
                z = -0.04 * facingDir;
                pitch = -0.18 * facingDir;
                pelvisGroup.rotation.x = -0.85;
                leftLeg.rotation.x = -1.45;
                rightLeg.rotation.x = -1.45;
                headGroup.rotation.x = 0.12;
            }
            else if (poseName === 'fl_pullups') {
                const rep = 0.5 - 0.5 * Math.cos(p * Math.PI * 4); // 2 חזרות
                y = THREE.MathUtils.lerp(-0.56, -0.16, rep);
                z = THREE.MathUtils.lerp(0.08, 0.04, rep) * facingDir;
                pitch = -(Math.PI / 2) * facingDir;
                headGroup.rotation.x = 0.24;
                leftPole.set(-0.32, -0.88, -0.35).normalize();
                rightPole.set(0.32, -0.88, -0.35).normalize();
            }
            else if (poseName === 'fl_presses') {
                const rep = 0.5 - 0.5 * Math.cos(p * Math.PI * 4);
                const angle = THREE.MathUtils.lerp(-Math.PI / 2, -Math.PI * 0.96, rep);
                const radius = 0.56;
                y = radius * Math.cos(angle);
                z = -radius * Math.sin(angle) * facingDir;
                pitch = angle * facingDir;
                headGroup.rotation.x = 0.20;
            }
            else if (poseName === 'bl_pullups') {
                const rep = 0.5 - 0.5 * Math.cos(p * Math.PI * 4); // 2 חזרות
                y = THREE.MathUtils.lerp(-0.54, -0.18, rep);
                z = THREE.MathUtils.lerp(-0.10, -0.06, rep) * facingDir;
                pitch = (Math.PI / 2) * facingDir;
                headGroup.rotation.x = -0.25;
                leftPole.set(-0.30, 0.85, -0.42).normalize();
                rightPole.set(0.30, 0.85, -0.42).normalize();
            }
            else if (poseName === 'bl_presses') {
                const rep = 0.5 - 0.5 * Math.cos(p * Math.PI * 4);
                const angle = THREE.MathUtils.lerp(Math.PI * 0.96, Math.PI / 2, rep);
                const radius = 0.55;
                y = radius * Math.cos(angle);
                z = -radius * Math.sin(angle) * facingDir;
                pitch = angle * facingDir;
                headGroup.rotation.x = -0.25;
                leftPole.set(-0.28, 0.72, -0.62).normalize();
                rightPole.set(0.28, 0.72, -0.62).normalize();
            }
            else if (poseName === 'planche_pushups') {
                const rep = 0.5 - 0.5 * Math.cos(p * Math.PI * 4); // 2 חזרות
                y = THREE.MathUtils.lerp(0.36, 0.19, rep);
                z = THREE.MathUtils.lerp(0.30, 0.38, rep) * facingDir;
                pitch = (Math.PI / 2) * facingDir;
                headGroup.rotation.x = -0.45;
                leftPole.set(-0.30, 0.25, -0.92).normalize();
                rightPole.set(0.30, 0.25, -0.92).normalize();
            }
            else if (poseName === 'planche_presses') {
                const rep = 0.5 - 0.5 * Math.cos(p * Math.PI * 2);
                y = THREE.MathUtils.lerp(0.36, 0.94, rep);
                z = THREE.MathUtils.lerp(0.30, 0.02, rep) * facingDir;
                pitch = THREE.MathUtils.lerp(Math.PI / 2, Math.PI, rep) * facingDir;
                headGroup.rotation.x = -0.46;
            }
            else if (poseName === 'maltese_presses') {
                const rep = 0.5 - 0.5 * Math.cos(p * Math.PI * 2);
                gripHalf = THREE.MathUtils.lerp(0.52, 0.34, rep);
                y = THREE.MathUtils.lerp(0.22, 0.90, rep);
                z = THREE.MathUtils.lerp(0.16, 0.02, rep) * facingDir;
                pitch = THREE.MathUtils.lerp(Math.PI / 2, Math.PI, rep) * facingDir;
                headGroup.rotation.x = -0.45;
            }
            else if (poseName === 'vsit_to_hs') {
                const rep = 0.5 - 0.5 * Math.cos(p * Math.PI * 2);
                y = THREE.MathUtils.lerp(0.58, 0.94, rep);
                z = THREE.MathUtils.lerp(-0.04, 0.02, rep) * facingDir;
                pitch = THREE.MathUtils.lerp(-0.18, Math.PI, rep) * facingDir;
                const fold = 1 - rep;
                pelvisGroup.rotation.x = -0.85 * fold;
                leftLeg.rotation.x = -1.45 * fold;
                rightLeg.rotation.x = -1.45 * fold;
                headGroup.rotation.x = THREE.MathUtils.lerp(0.12, -0.48, rep);
            }

            return { y, z, pitch, gripHalf, leftPole, rightPole };
        }

        function applyStaticOrStrengthPose(trick, progress, dt) {
            const poseName = trick.pose;

            // עליית כוח אולימפית מהירה, זורמת ודינאמית מתוך סווינג קדמי
            if (poseName === 'olympic_mu') {
                resetJointsToNeutral();
                let y = COM_OFFSET_Y;
                let z = 0;
                let pitch = 0;

                if (progress < 0.36) {
                    // שלב 1: סווינג קדמי מהיר מתחת למוט לצבירת מומנטום
                    const t = progress / 0.36;
                    const swingEase = Math.sin(t * (Math.PI / 2));
                    const angle = -swingEase * 1.18 * facingDir;
                    y = COM_OFFSET_Y * Math.cos(angle);
                    z = COM_OFFSET_Y * Math.sin(angle);
                    pitch = angle;
                    pelvisGroup.rotation.x = -0.36 * swingEase;
                    leftLeg.rotation.x = -0.42 * swingEase;
                    rightLeg.rotation.x = -0.42 * swingEase;
                    headGroup.rotation.x = -0.22 * swingEase;
                } else if (progress < 0.78) {
                    // שלב 2: משיכה מתפרצת והצלפת אגן מתוך שיא הסווינג הקדמי
                    const t = (progress - 0.36) / 0.42;
                    const easeOut = 1 - Math.pow(1 - t, 2.2);
                    const startAngle = -1.18 * facingDir;
                    const sweepAngle = THREE.MathUtils.lerp(startAngle, 0.25 * facingDir, easeOut);
                    const radius = THREE.MathUtils.lerp(0.95, 0.26, easeOut);
                    y = -radius * Math.cos(sweepAngle) + easeOut * 0.34;
                    z = -radius * Math.sin(sweepAngle) - Math.sin(t * Math.PI) * 0.24 * facingDir;
                    pitch = THREE.MathUtils.lerp(startAngle, 0.28 * facingDir, easeOut);
                    pelvisGroup.rotation.x = -0.46 * Math.sin(t * Math.PI);
                    leftLeg.rotation.x = -0.58 * Math.sin(t * Math.PI);
                    rightLeg.rotation.x = -0.58 * Math.sin(t * Math.PI);
                } else {
                    // שלב 3: נעילת כתפיים מהירה מעל המוט
                    const t = (progress - 0.78) / 0.22;
                    const ease = 1 - Math.pow(1 - t, 2);
                    y = THREE.MathUtils.lerp(0.12, TOP_SUPPORT_Y, ease);
                    z = THREE.MathUtils.lerp(-0.10, 0.04, ease) * facingDir;
                    pitch = THREE.MathUtils.lerp(0.28, 0.06, ease) * facingDir;
                    pelvisGroup.rotation.x = -0.10 * (1 - ease);
                    leftLeg.rotation.x = -0.14 * (1 - ease);
                    rightLeg.rotation.x = -0.14 * (1 - ease);
                }

                bodyMeshGroup.position.set(0, y, z);
                bodyMeshGroup.rotation.set(pitch, facingDir === 1 ? 0 : Math.PI, 0);

                const muLeftPole = new THREE.Vector3(-0.35, 0.35, -0.85).normalize();
                const muRightPole = new THREE.Vector3(0.35, 0.35, -0.85).normalize();
                lockHandsToBar(SHOULDER_OFFSET_X, muLeftPole, muRightPole);
                updateBarFlex(Math.sin(progress * Math.PI) * 0.12);

                staticCurrentPose = { y, z, pitch, gripHalf: SHOULDER_OFFSET_X };
                return;
            }

            // שלב א' במעבר מפלאנש / סטטי עליון לג'ייאנט: דחיפה חלקה לעמידת ידיים מעל המוט (top_to_hs_cast)
            if (trick.type === 'top_to_hs_cast') {
                resetJointsToNeutral();
                const ease = progress < 0.5 ? 2 * progress * progress : 1 - Math.pow(-2 * progress + 2, 2) / 2;
                const y = THREE.MathUtils.lerp(staticEntryPose.y, 0.95, ease);
                const z = THREE.MathUtils.lerp(staticEntryPose.z, 0, ease);
                const pitch = THREE.MathUtils.lerp(staticEntryPose.pitch, Math.PI * facingDir, ease);
                const gripHalf = THREE.MathUtils.lerp(staticEntryPose.gripHalf, SHOULDER_OFFSET_X, ease);

                bodyMeshGroup.position.set(0, y, z);
                bodyMeshGroup.rotation.set(pitch, facingDir === 1 ? 0 : Math.PI, 0);
                headGroup.rotation.x = -0.45 * ease;
                lockHandsToBar(gripHalf);
                updateBarFlex(0.05 * (1 - ease));
                staticCurrentPose = { y, z, pitch, gripHalf };
                return;
            }

            // ירידה מבוקרת (Simple Drop) בסיום התרגיל
            if (trick.type === 'static_drop') {
                resetJointsToNeutral();
                const ease = progress < 0.5 ? 2 * progress * progress : 1 - Math.pow(-2 * progress + 2, 2) / 2;
                const y = THREE.MathUtils.lerp(staticEntryPose.y, COM_OFFSET_Y, ease);
                const z = THREE.MathUtils.lerp(staticEntryPose.z, 0, ease);
                const pitch = THREE.MathUtils.lerp(staticEntryPose.pitch, 0, ease);
                const gripHalf = THREE.MathUtils.lerp(staticEntryPose.gripHalf, SHOULDER_OFFSET_X, ease);

                bodyMeshGroup.position.set(0, y, z);
                bodyMeshGroup.rotation.set(pitch, facingDir === 1 ? 0 : Math.PI, 0);
                lockHandsToBar(gripHalf);
                updateBarFlex((1 - ease) * 0.05);
                staticCurrentPose = { y, z, pitch, gripHalf };
                return;
            }

            // מעבר מ-Front Lever לסווינג: דגש על פרס קצר מתחת למוט, בעיטה מטה וקדימה וזרימה רציפה לצד -Z היחסי (360 Spin / B2B / Frisbee)
            if (trick.type === 'fl_press_kick_cast') {
                resetJointsToNeutral();
                let y, z, pitch;
                const targetReleaseAngle = trick.targetEndAngle !== undefined ? trick.targetEndAngle : (1.42 * facingDir);

                if (progress < 0.24) {
                    // שלב 1: פרס קצר מתחת למוט וטעינת אגן
                    const t = progress / 0.24;
                    const easePress = 1 - Math.pow(1 - t, 2);
                    y = THREE.MathUtils.lerp(staticEntryPose.y, -0.34, easePress);
                    z = THREE.MathUtils.lerp(staticEntryPose.z, 0.05 * facingDir, easePress);
                    pitch = THREE.MathUtils.lerp(staticEntryPose.pitch, -1.25 * facingDir, easePress);
                    pelvisGroup.rotation.x = -0.26 * easePress;
                    leftLeg.rotation.x = -0.34 * easePress;
                    rightLeg.rotation.x = -0.34 * easePress;
                } else {
                    // שלב 2: בעיטה מטה וקדימה דרך תחתית המתח והמשך סווינג רציף (C1) לצד -Z היחסי
                    const t = (progress - 0.24) / 0.76;
                    const flowAccel = 0.42 * t + 0.58 * t * t;
                    const startAngle = -1.25 * facingDir;
                    const sweepAngle = THREE.MathUtils.lerp(startAngle, targetReleaseAngle, flowAccel);
                    const radius = THREE.MathUtils.lerp(0.35, 0.95, Math.min(t / 0.35, 1.0));

                    y = -radius * Math.cos(sweepAngle);
                    z = -radius * Math.sin(sweepAngle);
                    pitch = sweepAngle;

                    const whipKick = Math.sin(t * Math.PI);
                    pelvisGroup.rotation.x = -0.44 * whipKick;
                    leftLeg.rotation.x = -0.54 * whipKick;
                    rightLeg.rotation.x = -0.54 * whipKick;
                    leftKnee.rotation.x = 0.24 * Math.max(0, Math.sin(t * Math.PI * 1.4));
                    rightKnee.rotation.x = 0.24 * Math.max(0, Math.sin(t * Math.PI * 1.4));
                    currentBarAngle = sweepAngle;
                }

                bodyMeshGroup.position.set(0, y, z);
                bodyMeshGroup.rotation.set(pitch, facingDir === 1 ? 0 : Math.PI, 0);

                const pressLeftPole = new THREE.Vector3(-0.30, -0.85, -0.38).normalize();
                const pressRightPole = new THREE.Vector3(0.30, -0.85, -0.38).normalize();
                lockHandsToBar(SHOULDER_OFFSET_X, pressLeftPole, pressRightPole);
                updateBarFlex(Math.sin(progress * Math.PI) * 0.10);
                staticCurrentPose = { y, z, pitch, gripHalf: SHOULDER_OFFSET_X };
                return;
            }

            // תרגילי סטטי ודינאמי כוח רגילים
            const tremor = Math.sin(trickTime * 19.0) * 0.4 + Math.sin(trickTime * 31.0) * 0.3;
            const target = getStaticPoseParams(poseName, progress, tremor);

            const blendIn = Math.min(progress / 0.18, 1.0);
            const blendEase = 1 - Math.pow(1 - blendIn, 3);

            const y = THREE.MathUtils.lerp(staticEntryPose.y, target.y, blendEase);
            const z = THREE.MathUtils.lerp(staticEntryPose.z, target.z, blendEase);
            const pitch = THREE.MathUtils.lerp(staticEntryPose.pitch, target.pitch, blendEase);
            const gripHalf = THREE.MathUtils.lerp(staticEntryPose.gripHalf, target.gripHalf, blendEase);

            bodyMeshGroup.position.set(0, y, z);
            bodyMeshGroup.rotation.set(pitch, facingDir === 1 ? 0 : Math.PI, 0);

            if (poseName === 'one_arm_fl') {
                bodyMeshGroup.updateMatrix();
                const invBodyMat = new THREE.Matrix4().copy(bodyMeshGroup.matrix).invert();
                const rightHandBar = new THREE.Vector3(0.06, 0, 0).applyMatrix4(invBodyMat);
                solveTwoBoneArmIK(rightArm, rightElbow, rightHandBar, target.rightPole);
                leftArm.rotation.set(Math.PI, 0, -0.18);
                leftElbow.rotation.set(0.15, 0, 0);
            } else {
                lockHandsToBar(gripHalf, target.leftPole, target.rightPole);
            }

            updateBarFlex(0.065 + Math.abs(tremor) * 0.01);
            staticCurrentPose = { y, z, pitch, gripHalf };
        }

        // ==========================================
        // 5. מכונת מצבים וביומכניקה מתקדמת
        // ==========================================
        function updateFacingBadge() {
            const badge = document.getElementById('facing-badge');
            if (facingDir === 1) {
                badge.textContent = 'קדימה (+Z)';
                badge.className = 'text-xs font-bold text-amber-300';
            } else {
                badge.textContent = 'אחורה (-Z)';
                badge.className = 'text-xs font-bold text-pink-400';
            }
        }

        function setStaticExitMode(mode) {
            staticExitMode = mode;
            const btnDrop = document.getElementById('btn-exit-drop');
            const btnSwing = document.getElementById('btn-exit-swing');
            if (mode === 'drop') {
                btnDrop.className = 'px-2 py-0.5 rounded bg-purple-600 text-white font-bold transition cursor-pointer';
                btnSwing.className = 'px-2 py-0.5 rounded bg-slate-800 text-slate-300 hover:bg-slate-700 font-bold transition cursor-pointer';
            } else {
                btnSwing.className = 'px-2 py-0.5 rounded bg-amber-600 text-white font-bold transition cursor-pointer';
                btnDrop.className = 'px-2 py-0.5 rounded bg-slate-800 text-slate-300 hover:bg-slate-700 font-bold transition cursor-pointer';
            }
        }

        function updateUIState(stateText, moveText = '-') {
            const badge = document.getElementById('state-badge');
            badge.textContent = stateText;
            document.getElementById('current-move-badge').textContent = moveText;

            badge.className = 'text-xs sm:text-sm font-semibold ';
            if (state === 'idle') badge.className += 'text-emerald-400';
            else if (state === 'prep_swing' || state === 'swinging') badge.className += 'text-amber-400';
            else if (state === 'static_hold') badge.className += 'text-purple-300';
            else if (state === 'flying' || state === 'dismounting') badge.className += 'text-cyan-400';
            else if (state === 'landing_impact' || state === 'landed') badge.className += 'text-purple-400';
        }

        function updateBarFlex(deflectionY) {
            if (!highBarMesh || !highBarMesh.geometry) return;
            const geo = highBarMesh.geometry;
            const orig = geo.userData.origPositions;
            const pos = geo.attributes.position.array;
            const halfSpan = 1.65;

            for (let i = 0; i < pos.length; i += 3) {
                const x = orig[i];
                const normX = Math.min(Math.abs(x) / halfSpan, 1.0);
                const bendFactor = Math.pow(1 - normX * normX, 1.5);
                pos[i + 1] = orig[i + 1] - deflectionY * bendFactor;
            }
            geo.attributes.position.needsUpdate = true;
        }

        function resetJointsToNeutral() {
            if (!leftArm) return;
            leftArm.rotation.set(0, 0, 0);
            rightArm.rotation.set(0, 0, 0);
            leftElbow.rotation.set(0, 0, 0);
            rightElbow.rotation.set(0, 0, 0);
            pelvisGroup.rotation.set(0, 0, 0);
            headGroup.rotation.set(0, 0, 0);
            leftLeg.rotation.set(0, 0, 0);
            rightLeg.rotation.set(0, 0, 0);
            leftKnee.rotation.set(0, 0, 0);
            rightKnee.rotation.set(0, 0, 0);
            torso.rotation.set(0, 0, 0);
            bodyMeshGroup.position.set(0, COM_OFFSET_Y, 0);
        }

        function applySwingBiomechanics(barAngle, angularVelNorm, whipSnap = 0) {
            resetJointsToNeutral();

            const localSwingAngle = barAngle * facingDir;
            const localAngVel = angularVelNorm * facingDir;

            const archHollowCurve = Math.sin(localSwingAngle * 1.15) * 0.42 + localAngVel * 0.34 + whipSnap * 0.35;

            headGroup.rotation.x = THREE.MathUtils.clamp(-archHollowCurve * 0.45, -0.35, 0.35);
            pelvisGroup.rotation.x = -archHollowCurve * 0.42;
            leftLeg.rotation.x = -archHollowCurve * 0.48;
            rightLeg.rotation.x = -archHollowCurve * 0.48;

            const kneeWhipBend = Math.max(0, archHollowCurve) * 0.42;
            leftKnee.rotation.x = kneeWhipBend;
            rightKnee.rotation.x = kneeWhipBend;
        }

        function applyCatchImpactOverlay(dt) {
            if (catchImpulseTime <= 0) {
                updateBarFlex(0);
                return;
            }
            catchImpulseTime = Math.max(0, catchImpulseTime - dt);
            const tNorm = 1.0 - (catchImpulseTime / CATCH_DAMP_DURATION);

            const dampedWave = Math.exp(-tNorm * 5.2) * Math.sin(tNorm * Math.PI * 2.5);
            const stretchDown = Math.max(0, Math.sin(tNorm * Math.PI) * Math.exp(-tNorm * 2.8)) * catchImpulseStrength;

            updateBarFlex(stretchDown * 0.14);

            bodyMeshGroup.position.y = COM_OFFSET_Y - stretchDown * 0.09;
            leftElbow.rotation.x = -stretchDown * 0.32;
            rightElbow.rotation.x = -stretchDown * 0.32;
            pelvisGroup.rotation.x += dampedWave * 0.18 * catchImpulseStrength;
        }

        function setAirBiomechanics(mode, progress, extraAmount = 1.0) {
            resetJointsToNeutral();

            if (mode === 'tuck_progressive') {
                let tuckFactor = 0;
                if (progress < 0.22) {
                    const p = progress / 0.22;
                    tuckFactor = p * p;
                } else if (progress < 0.76) {
                    tuckFactor = 1.0;
                } else {
                    const p = (progress - 0.76) / 0.24;
                    tuckFactor = 1.0 - (p * p);
                }

                pelvisGroup.rotation.x = -0.35 * tuckFactor;
                leftLeg.rotation.x = -1.25 * tuckFactor;
                rightLeg.rotation.x = -1.25 * tuckFactor;
                leftKnee.rotation.x = 1.65 * tuckFactor;
                rightKnee.rotation.x = 1.65 * tuckFactor;

                const reachOut = progress > 0.76 ? ((progress - 0.76) / 0.24) : 0;
                leftArm.rotation.set(-2.1 * tuckFactor - 0.35 * reachOut, 0, -0.15 * tuckFactor);
                rightArm.rotation.set(-2.1 * tuckFactor - 0.35 * reachOut, 0, 0.15 * tuckFactor);
                leftElbow.rotation.set(-0.95 * tuckFactor * (1 - reachOut), 0, 0);
                rightElbow.rotation.set(-0.95 * tuckFactor * (1 - reachOut), 0, 0);
                headGroup.rotation.x = -0.3 * tuckFactor + 0.35 * reachOut;
            }
            else if (mode === 'layout_hollow') {
                const archCurve = Math.sin(progress * Math.PI) * 0.18;
                pelvisGroup.rotation.x = -archCurve;
                leftLeg.rotation.x = -archCurve * 0.8;
                rightLeg.rotation.x = -archCurve * 0.8;
                leftArm.rotation.set(-0.25, 0, -0.35);
                rightArm.rotation.set(-0.25, 0, 0.35);
            }
            else if (mode === 'straddle_dynamic') {
                const env = Math.sin(progress * Math.PI) * extraAmount;
                pelvisGroup.rotation.x = -0.35 * env;
                leftLeg.rotation.set(-0.75 * env, 0, -0.85 * env);
                rightLeg.rotation.set(-0.75 * env, 0, 0.85 * env);
                leftKnee.rotation.set(0.12 * env, 0, 0);
                rightKnee.rotation.set(0.12 * env, 0, 0);
                leftArm.rotation.set(-0.35 * env, 0, -0.55 * env);
                rightArm.rotation.set(-0.35 * env, 0, 0.55 * env);
                headGroup.rotation.x = 0.25 * env;
            }
            else if (mode === 'spin_tight') {
                const tighten = Math.sin(progress * Math.PI);
                leftArm.rotation.set(-0.12 * tighten, 0, -0.22 * (1 - tighten * 0.5));
                rightArm.rotation.set(-0.12 * tighten, 0, 0.22 * (1 - tighten * 0.5));
                leftElbow.rotation.set(-0.25 * tighten, 0, 0);
                rightElbow.rotation.set(-0.25 * tighten, 0, 0);
                pelvisGroup.rotation.x = -0.10 * tighten;
            }
            else if (mode === 'landing_absorb') {
                const bend = Math.sin(extraAmount * Math.PI);
                bodyMeshGroup.position.y = COM_OFFSET_Y - bend * 0.26;
                pelvisGroup.rotation.x = 0.25 * bend;
                torso.rotation.x = 0.24 * bend;
                leftLeg.rotation.set(-0.75 * bend, 0, 0);
                rightLeg.rotation.set(-0.75 * bend, 0, 0);
                leftKnee.rotation.set(1.35 * bend, 0, 0);
                rightKnee.rotation.set(1.35 * bend, 0, 0);
                leftArm.rotation.set(-0.55 * bend, 0, -1.75);
                rightArm.rotation.set(-0.55 * bend, 0, 1.75);
                leftElbow.rotation.set(-0.25 * bend, 0, 0);
                rightElbow.rotation.set(-0.25 * bend, 0, 0);
            }
            else if (mode === 'landed') {
                leftArm.rotation.set(0, 0, -2.1);
                rightArm.rotation.set(0, 0, 2.1);
            }
        }

        function resetAthlete(keepCombo = false) {
            state = 'idle';
            currentTrick = null;
            trickTime = 0;
            swingTime = 0;
            swingWaypoints = [];
            activeSwingSegment = null;
            currentBarAngle = 0;
            giantCarryoverDir = 0;
            staticZoneState = 'hanging';
            staticEntryPose = { y: COM_OFFSET_Y, z: 0, pitch: 0, gripHalf: SHOULDER_OFFSET_X };
            staticCurrentPose = { y: COM_OFFSET_Y, z: 0, pitch: 0, gripHalf: SHOULDER_OFFSET_X };
            pendingTopTrick = null;
            flCastCarryover = false;
            catchImpulseTime = 0;
            catchImpulseStrength = 0;
            facingDir = 1;
            updateFacingBadge();
            updateBarFlex(0);

            if (!keepCombo) {
                isPlayingCombo = false;
                comboIndex = 0;
            }

            if (barPivot) {
                barPivot.rotation.set(0, 0, 0);
                athlete.position.set(0, 0, 0);
                athlete.rotation.set(0, 0, 0);
                bodyMeshGroup.rotation.set(0, 0, 0);
                resetJointsToNeutral();
            }

            updateUIState('אחיזה במתח (Idle)', '-');
        }

        function getDetachedOffsetForBarAngle(angle) {
            const yOffset = COM_OFFSET_Y * (Math.cos(angle) - 1);
            const zOffset = COM_OFFSET_Y * Math.sin(angle);
            return new THREE.Vector3(0, yOffset, zOffset);
        }

        function computeParabolicKinematics(y0, y1, desiredPeakAboveMax, duration) {
            const apexY = Math.max(y0, y1) + desiredPeakAboveMax;
            const dyUp = Math.max(0.08, apexY - y0);
            const dyDown = Math.max(0.08, apexY - y1);

            const tUpIdeal = Math.sqrt((2 * dyUp) / GRAVITY);
            const tDownIdeal = Math.sqrt((2 * dyDown) / GRAVITY);
            const totalIdeal = tUpIdeal + tDownIdeal;

            const timeScale = duration / totalIdeal;
            const effectiveGravity = GRAVITY / (timeScale * timeScale);
            const vy0 = (y1 - y0 + 0.5 * effectiveGravity * duration * duration) / duration;

            return {
                y0,
                y1,
                vy0,
                gravity: effectiveGravity,
                totalTime: duration
            };
        }

        function evaluateParabolicY(kin, t) {
            return kin.y0 + kin.vy0 * t - 0.5 * kin.gravity * t * t;
        }

        function buildSwingSegments(startAngle, targetReleaseAngle, worldSwingDir) {
            const segments = [];
            const sameSideAsRelease = (Math.sign(startAngle) === Math.sign(targetReleaseAngle)) && Math.abs(startAngle) > 0.25;

            if (sameSideAsRelease) {
                const counterSwingAngle = worldSwingDir * 2.35;
                segments.push({
                    from: startAngle,
                    to: counterSwingAngle,
                    duration: 0.72,
                    isLaunchSwing: false,
                    label: 'סווינג ביניים עמוק (בניית תנופה)'
                });
                segments.push({
                    from: counterSwingAngle,
                    to: targetReleaseAngle,
                    duration: 0.76,
                    isLaunchSwing: true,
                    label: 'סווינג שיגור מלא (Whip)'
                });
            } else if (Math.abs(startAngle) <= 0.25) {
                const windupAngle = worldSwingDir * 2.25;
                segments.push({
                    from: startAngle,
                    to: windupAngle,
                    duration: 0.64,
                    isLaunchSwing: false,
                    label: 'הכנת תנופה גבוהה (Arch)'
                });
                segments.push({
                    from: windupAngle,
                    to: targetReleaseAngle,
                    duration: 0.72,
                    isLaunchSwing: true,
                    label: 'תנופת יציאה עמוקה (Hollow Whip)'
                });
            } else {
                segments.push({
                    from: startAngle,
                    to: targetReleaseAngle,
                    duration: 0.68,
                    isLaunchSwing: true,
                    label: 'תנופת יציאה עמוקה (Hollow Whip)'
                });
            }

            return segments;
        }

        function startTrick(trick) {
            if (!isInitialized) initScene();
            if (state === 'landed' || state === 'landing_impact') {
                resetAthlete(isPlayingCombo);
            }

            // 1. טיפול בתרגילי סטטי ודינאמי כוח
            if (trick.type === 'static' || trick.type === 'strength' || trick.type === 'static_drop' || trick.type === 'fl_press_kick_cast' || trick.type === 'top_to_hs_cast') {
                if (trick.zone === 'top' && staticZoneState !== 'top') {
                    pendingTopTrick = trick;
                    const muTrick = TRICKS.strength.find(t => t.id === 'olympic_mu');
                    startTrick(muTrick);
                    return;
                }

                staticEntryPose = {
                    y: bodyMeshGroup ? bodyMeshGroup.position.y : COM_OFFSET_Y,
                    z: bodyMeshGroup ? bodyMeshGroup.position.z : 0,
                    pitch: bodyMeshGroup ? bodyMeshGroup.rotation.x : 0,
                    gripHalf: staticCurrentPose.gripHalf || SHOULDER_OFFSET_X
                };

                barPivot.rotation.set(0, 0, 0);
                athlete.position.set(0, 0, 0);
                currentBarAngle = 0;
                giantCarryoverDir = 0;

                currentTrick = trick;
                trickTime = 0;
                state = 'static_hold';
                updateUIState(trick.type === 'static' ? 'החזקת סטטי (Static)' : 'דינאמי כוח (Strength)', trick.name);
                return;
            }

            // 2. מעבר דו-שלבי חלק מפלאנש / סטטי עליון אל Back Giant
            if (trick.type === 'giant' && trick.direction === 1 && staticZoneState === 'top') {
                if (!trick.fromHandstandDrop) {
                    // שלב א': דחיפה/קאסט חלק לעמידת ידיים מעל המוט
                    startTrick({
                        id: 'top_to_hs_cast',
                        name: 'Cast to Handstand',
                        type: 'top_to_hs_cast',
                        pose: 'top_to_hs_cast',
                        duration: 0.52,
                        nextGiantTrick: { ...trick, fromHandstandDrop: true, duration: 1.32 }
                    });
                    return;
                }

                // שלב ב': נפילת כבידה רציפה מעמידת ידיים לתוך Back Giant
                staticZoneState = 'hanging';
                staticCurrentPose = { y: COM_OFFSET_Y, z: 0, pitch: 0, gripHalf: SHOULDER_OFFSET_X };
                bodyMeshGroup.position.set(0, COM_OFFSET_Y, 0);
                bodyMeshGroup.rotation.set(0, facingDir === 1 ? 0 : Math.PI, 0);
                resetJointsToNeutral();

                currentTrick = trick;
                trickTime = 0;
                giantCarryoverDir = 0;
                state = 'swinging';
                updateUIState('נפילה כבידתית מעמידת ידיים לג\'ייאנט', trick.name);
                return;
            }

            // 3. אם האתלט עדיין מעל המוט ונבחר תרגיל תנופה רגיל — יורד קודם בצורה חלקה
            if (staticZoneState === 'top') {
                staticZoneState = 'hanging';
                staticCurrentPose = { y: COM_OFFSET_Y, z: 0, pitch: 0, gripHalf: SHOULDER_OFFSET_X };
                bodyMeshGroup.position.set(0, COM_OFFSET_Y, 0);
                bodyMeshGroup.rotation.set(0, facingDir === 1 ? 0 : Math.PI, 0);
                resetJointsToNeutral();
            }

            currentTrick = trick;
            trickTime = 0;

            if (trick.type === 'swing' || trick.type === 'giant') {
                giantCarryoverDir = 0;
                flCastCarryover = false;
                state = 'swinging';
                resetJointsToNeutral();
                updateUIState('תנופה ביומכנית (Swinging)', trick.name);
                return;
            }

            const worldSwingDir = trick.relReleaseDir * facingDir;
            let swingAngleMag = 1.45;
            if (trick.type === 'dismount') {
                swingAngleMag = 1.65;
            } else if (trick.type === 'release') {
                swingAngleMag = 1.55;
            } else if (trick.type === 'spin') {
                const spinBonus = Math.min((trick.degrees / 1260) * 0.45, 0.45);
                swingAngleMag = 1.32 + spinBonus;
            }
            const targetReleaseAngle = -worldSwingDir * swingAngleMag;

            // יציאה מיידית ורציפה (C1) מתוך fl_press_kick_cast אל תרגילי סווינג אחורי בצד -Z היחסי (360 Spin, B2B, Frisbee, Iceball)
            if (flCastCarryover && trick.relReleaseDir === -1) {
                flCastCarryover = false;
                currentBarAngle = targetReleaseAngle;
                barPivot.rotation.set(currentBarAngle, 0, 0);
                launchFromSwing();
                return;
            }
            flCastCarryover = false;

            const activeGiantMomentum = giantCarryoverDir;
            giantCarryoverDir = 0;

            if (activeGiantMomentum !== 0) {
                if (activeGiantMomentum === worldSwingDir) {
                    currentBarAngle = targetReleaseAngle;
                    barPivot.rotation.set(currentBarAngle, 0, 0);
                    launchFromSwing();
                    return;
                } else {
                    const entryAngleFromGiant = activeGiantMomentum * 1.45;
                    swingWaypoints = [{
                        from: entryAngleFromGiant,
                        to: targetReleaseAngle,
                        duration: 0.64,
                        isLaunchSwing: true,
                        label: 'מעבר מומנטום מהג\'ייאנט לשיגור'
                    }];
                    activeSwingSegment = swingWaypoints.shift();
                    swingTime = 0;
                    state = 'prep_swing';
                    updateUIState(activeSwingSegment.label, trick.name);
                    return;
                }
            }

            swingWaypoints = buildSwingSegments(currentBarAngle, targetReleaseAngle, worldSwingDir);
            activeSwingSegment = swingWaypoints.shift();
            swingTime = 0;

            state = 'prep_swing';
            updateUIState(activeSwingSegment.label, trick.name);
        }

        function launchFromSwing() {
            releaseAthletePos.copy(getDetachedOffsetForBarAngle(currentBarAngle));
            releasePitchX = currentBarAngle;

            barPivot.rotation.x = 0;
            athlete.position.copy(releaseAthletePos);
            bodyMeshGroup.rotation.x = releasePitchX;
            bodyMeshGroup.rotation.y = facingDir === 1 ? 0 : Math.PI;
            catchImpulseTime = 0;
            updateBarFlex(0);

            const worldSwingDir = currentTrick.relReleaseDir * facingDir;

            if (currentTrick.type === 'spin') {
                catchTargetBarAngle = -worldSwingDir * 0.95;
                catchAthletePos.copy(getDetachedOffsetForBarAngle(catchTargetBarAngle));
                flightKinematics = computeParabolicKinematics(
                    releaseAthletePos.y,
                    catchAthletePos.y,
                    currentTrick.height,
                    currentTrick.duration
                );
            } else if (currentTrick.type === 'release') {
                if (currentTrick.crossBar) {
                    catchTargetBarAngle = worldSwingDir * 1.15;
                } else {
                    catchTargetBarAngle = -worldSwingDir * 1.15;
                }
                catchAthletePos.copy(getDetachedOffsetForBarAngle(catchTargetBarAngle));
                flightKinematics = computeParabolicKinematics(
                    releaseAthletePos.y,
                    catchAthletePos.y,
                    currentTrick.peakHeight,
                    currentTrick.duration
                );
            } else if (currentTrick.type === 'dismount') {
                flightKinematics = computeParabolicKinematics(
                    releaseAthletePos.y,
                    LANDED_ATHLETE_Y,
                    currentTrick.peakHeight,
                    currentTrick.duration
                );
            }

            trickTime = 0;
            if (currentTrick.type === 'dismount') {
                state = 'dismounting';
                updateUIState('ירידה מהמתח (כבידה)', currentTrick.name);
            } else {
                state = 'flying';
                updateUIState('ריחוף באוויר (כבידה)', currentTrick.name);
            }
        }

        function onTrickComplete() {
            const finishedTrick = currentTrick;
            currentTrick = null;
            trickTime = 0;

            // סיום שלב א' במעבר מפלאנש / סטטי עליון לג'ייאנט -> הפעלה מיידית של נפילת הכבידה לג'ייאנט
            if (finishedTrick.type === 'top_to_hs_cast') {
                startTrick(finishedTrick.nextGiantTrick);
                return;
            }

            // סיום עליית כוח אולימפית
            if (finishedTrick.pose === 'olympic_mu') {
                staticZoneState = 'top';
                if (pendingTopTrick) {
                    const nextTop = pendingTopTrick;
                    pendingTopTrick = null;
                    startTrick(nextTop);
                    return;
                }
                if (isPlayingCombo && comboIndex + 1 < comboQueue.length) {
                    const peekNext = comboQueue[comboIndex + 1];
                    if (peekNext.zone === 'top') {
                        comboIndex++;
                        startTrick(comboQueue[comboIndex]);
                        return;
                    }
                }
                if (staticExitMode === 'swing') {
                    startTrick({ id: 'giant_back', name: 'Back Giant', type: 'giant', direction: 1, duration: 1.50 });
                    return;
                }
                startTrick({ id: 'static_drop', name: 'ירידה מבוקרת', type: 'static_drop', pose: 'static_drop', duration: 0.65 });
                return;
            }

            // סיום ירידה מבוקרת מסטטי
            if (finishedTrick.type === 'static_drop') {
                staticZoneState = 'hanging';
                staticCurrentPose = { y: COM_OFFSET_Y, z: 0, pitch: 0, gripHalf: SHOULDER_OFFSET_X };
                bodyMeshGroup.position.set(0, COM_OFFSET_Y, 0);
                bodyMeshGroup.rotation.set(0, facingDir === 1 ? 0 : Math.PI, 0);
                resetJointsToNeutral();

                if (isPlayingCombo) {
                    comboIndex++;
                    if (comboIndex < comboQueue.length) {
                        startTrick(comboQueue[comboIndex]);
                        return;
                    } else {
                        isPlayingCombo = false;
                    }
                }
                state = 'idle';
                updateUIState('אחיזה במתח (Idle)', '-');
                return;
            }

            // סיום פרס ובעיטה קדימה מ-Front Lever אל צד -Z היחסי (C1 continuity ללא איפוס בין פריימים)
            if (finishedTrick.type === 'fl_press_kick_cast') {
                staticZoneState = 'hanging';
                const endAngle = finishedTrick.targetEndAngle !== undefined ? finishedTrick.targetEndAngle : (1.42 * facingDir);
                staticCurrentPose = { y: COM_OFFSET_Y, z: 0, pitch: 0, gripHalf: SHOULDER_OFFSET_X };

                if (isPlayingCombo) {
                    comboIndex++;
                    if (comboIndex < comboQueue.length) {
                        const nextTrick = comboQueue[comboIndex];
                        // אם התרגיל הבא יוצא מצד -Z היחסי (360 Spin, B2B, Frisbee, Iceball וכו'), משגרים מיד ללא איפוס
                        if (nextTrick.relReleaseDir === -1) {
                            flCastCarryover = true;
                            bodyMeshGroup.position.set(0, COM_OFFSET_Y, 0);
                            bodyMeshGroup.rotation.set(0, facingDir === 1 ? 0 : Math.PI, 0);
                            resetJointsToNeutral();
                            startTrick(nextTrick);
                            return;
                        }
                        // לתרגילים אחרים שומרים על זווית השיא endAngle וממשיכים ממנה חלק
                        bodyMeshGroup.position.set(0, COM_OFFSET_Y, 0);
                        bodyMeshGroup.rotation.set(0, facingDir === 1 ? 0 : Math.PI, 0);
                        resetJointsToNeutral();
                        currentBarAngle = endAngle;
                        barPivot.rotation.set(currentBarAngle, 0, 0);
                        startTrick(nextTrick);
                        return;
                    } else {
                        isPlayingCombo = false;
                    }
                }

                // אם לא בקומבו, ממשיך לתנופת Tap Swing
                bodyMeshGroup.position.set(0, COM_OFFSET_Y, 0);
                bodyMeshGroup.rotation.set(0, facingDir === 1 ? 0 : Math.PI, 0);
                resetJointsToNeutral();
                currentBarAngle = endAngle;
                barPivot.rotation.set(currentBarAngle, 0, 0);
                startTrick(TRICKS.swing[0]);
                return;
            }

            // סיום תרגיל סטטי או דינאמי כוח
            if (finishedTrick.type === 'static' || finishedTrick.type === 'strength') {
                staticZoneState = finishedTrick.zone || 'hanging';
                const nextInCombo = (isPlayingCombo && comboIndex + 1 < comboQueue.length) ? comboQueue[comboIndex + 1] : null;

                if (nextInCombo) {
                    // מעבר דו-שלבי חלק מפלאנש / סטטי עליון לג'ייאנט אחורי
                    if (staticZoneState === 'top' && nextInCombo.type === 'giant' && nextInCombo.direction === 1) {
                        comboIndex++;
                        startTrick(nextInCombo);
                        return;
                    }
                    // מעבר עם פרס ובעיטה קדימה מ-Front Lever או Back Lever לתנופה או לעזיבת סווינג אחורי (-Z יחסי)
                    if ((finishedTrick.pose === 'front_lever' || finishedTrick.pose === 'fl_pullups' || finishedTrick.pose === 'fl_presses' || finishedTrick.pose === 'back_lever') &&
                        (nextInCombo.type === 'swing' || nextInCombo.type === 'giant' || nextInCombo.relReleaseDir === -1)) {
                        let targetEndAngle = 1.42 * facingDir;
                        if (nextInCombo.relReleaseDir === -1) {
                            let mag = 1.45;
                            if (nextInCombo.type === 'dismount') mag = 1.65;
                            else if (nextInCombo.type === 'release') mag = 1.55;
                            else if (nextInCombo.type === 'spin') mag = 1.32 + Math.min((nextInCombo.degrees / 1260) * 0.45, 0.45);
                            targetEndAngle = mag * facingDir; // תמיד בצד -Z היחסי!
                        }
                        startTrick({ id: 'fl_press_kick_cast', name: 'Press & Kick Cast', type: 'fl_press_kick_cast', pose: 'fl_press_kick_cast', duration: 0.72, targetEndAngle });
                        return;
                    }
                    if ((nextInCombo.type === 'static' || nextInCombo.type === 'strength') && nextInCombo.zone === staticZoneState) {
                        comboIndex++;
                        startTrick(nextInCombo);
                        return;
                    }
                    startTrick({ id: 'static_drop', name: 'ירידה מבוקרת', type: 'static_drop', pose: 'static_drop', duration: 0.58 });
                    return;
                }

                if (staticExitMode === 'swing') {
                    if (staticZoneState === 'top') {
                        startTrick({ id: 'giant_back', name: 'Back Giant', type: 'giant', direction: 1, duration: 1.50 });
                        return;
                    } else {
                        startTrick({ id: 'fl_press_kick_cast', name: 'Press & Kick Cast', type: 'fl_press_kick_cast', pose: 'fl_press_kick_cast', duration: 0.72, targetEndAngle: 1.42 * facingDir });
                        return;
                    }
                } else {
                    startTrick({ id: 'static_drop', name: 'ירידה מבוקרת', type: 'static_drop', pose: 'static_drop', duration: 0.65 });
                    return;
                }
            }

            if (finishedTrick.type === 'dismount') {
                const worldSwingDir = finishedTrick.relReleaseDir * facingDir;
                const finalLandingZ = worldSwingDir * finishedTrick.dist;

                const isFrontExitFlip = (finishedTrick.relReleaseDir === -1 && finishedTrick.flips > 0) ||
                                        (finishedTrick.relReleaseDir === 1 && finishedTrick.flips < 0);
                const finalYaw = isFrontExitFlip
                    ? (worldSwingDir === 1 ? 0 : Math.PI)
                    : (worldSwingDir === 1 ? Math.PI : 0);

                state = 'landing_impact';
                landingTime = 0;
                barPivot.rotation.set(0, 0, 0);
                bodyMeshGroup.rotation.set(0, finalYaw, 0);
                athlete.rotation.set(0, 0, 0);
                athlete.position.set(0, LANDED_ATHLETE_Y, finalLandingZ);
                setAirBiomechanics('landing_absorb', 1.0, 0);
                updateUIState('בלימת נחיתה (Landing)', finishedTrick.name);
                isPlayingCombo = false;
                return;
            }

            let halfTurns = 0;
            if (finishedTrick.type === 'spin') {
                halfTurns = Math.round(finishedTrick.degrees / 180);
            } else if (finishedTrick.type === 'release') {
                halfTurns = Math.round(finishedTrick.twists * 2);
            }

            if (halfTurns % 2 !== 0) {
                facingDir *= -1;
                updateFacingBadge();
            }

            if (finishedTrick.type === 'release' || finishedTrick.type === 'spin') {
                catchImpulseTime = CATCH_DAMP_DURATION;
                catchImpulseStrength = finishedTrick.type === 'release' ? 1.0 : 0.55;
            }

            if (finishedTrick.type === 'giant') {
                giantCarryoverDir = -finishedTrick.direction * facingDir;
            } else {
                giantCarryoverDir = 0;
            }

            currentBarAngle = (finishedTrick.type === 'spin' || finishedTrick.type === 'release') ? catchTargetBarAngle : 0;
            barPivot.rotation.set(currentBarAngle, 0, 0);
            athlete.position.set(0, 0, 0);
            athlete.rotation.set(0, 0, 0);
            bodyMeshGroup.rotation.set(0, facingDir === 1 ? 0 : Math.PI, 0);
            resetJointsToNeutral();

            if (isPlayingCombo) {
                comboIndex++;
                if (comboIndex < comboQueue.length) {
                    startTrick(comboQueue[comboIndex]);
                    return;
                } else {
                    isPlayingCombo = false;
                }
            }

            state = 'idle';
            updateUIState('אחיזה במתח (Idle)', '-');
        }

        // ==========================================
        // 6. לולאת אנימציה (Animation Loop)
        // ==========================================
        function animate() {
            requestAnimationFrame(animate);
            if (!renderer || !scene || !camera) return;

            try {
                const rawDt = Math.min(clock.getDelta(), 0.05);
                const dt = rawDt * slowMoFactor;

                if (state === 'idle') {
                    idleTime += dt;
                    const targetIdleAngle = Math.sin(idleTime * 2.2) * 0.05;
                    const prevAngle = currentBarAngle;
                    currentBarAngle = THREE.MathUtils.lerp(currentBarAngle, targetIdleAngle, dt * 3.5);
                    const angVel = (currentBarAngle - prevAngle) / Math.max(dt, 0.001);

                    barPivot.rotation.x = currentBarAngle;
                    bodyMeshGroup.rotation.y = facingDir === 1 ? 0 : Math.PI;
                    applySwingBiomechanics(currentBarAngle, THREE.MathUtils.clamp(angVel * 0.25, -1, 1), 0);
                    applyCatchImpactOverlay(dt);
                }
                else if (state === 'landing_impact') {
                    landingTime += dt;
                    const p = Math.min(landingTime / LANDING_ABSORB_DURATION, 1.0);
                    setAirBiomechanics('landing_absorb', 1.0, p);
                    if (p >= 1.0) {
                        state = 'landed';
                        setAirBiomechanics('landed', 1.0, 1.0);
                        updateUIState('נחיתה מושלמת (Landed)', document.getElementById('current-move-badge').textContent);
                    }
                }
                else if (state === 'static_hold' && currentTrick) {
                    trickTime += dt;
                    const progress = Math.min(trickTime / currentTrick.duration, 1.0);
                    applyStaticOrStrengthPose(currentTrick, progress, dt);
                    if (progress >= 1.0) {
                        onTrickComplete();
                    }
                }
                else if (state === 'prep_swing' && currentTrick && activeSwingSegment) {
                    swingTime += dt;
                    const p = Math.min(swingTime / activeSwingSegment.duration, 1.0);
                    const pendulumEase = p < 0.5
                        ? 2 * p * p
                        : 1 - Math.pow(-2 * p + 2, 2) / 2;

                    const prevAngle = currentBarAngle;
                    currentBarAngle = THREE.MathUtils.lerp(activeSwingSegment.from, activeSwingSegment.to, pendulumEase);
                    barPivot.rotation.x = currentBarAngle;

                    const angVelNorm = THREE.MathUtils.clamp(((currentBarAngle - prevAngle) / Math.max(dt, 0.001)) * 0.22, -1.2, 1.2);
                    const whipSnap = (activeSwingSegment.isLaunchSwing && p > 0.65)
                        ? Math.sin(((p - 0.65) / 0.35) * Math.PI) * Math.sign(activeSwingSegment.to - activeSwingSegment.from)
                        : 0;

                    applySwingBiomechanics(currentBarAngle, angVelNorm, whipSnap);
                    applyCatchImpactOverlay(dt);

                    if (p >= 1.0) {
                        if (swingWaypoints.length > 0) {
                            activeSwingSegment = swingWaypoints.shift();
                            swingTime = 0;
                            updateUIState(activeSwingSegment.label, currentTrick.name);
                        } else {
                            activeSwingSegment = null;
                            launchFromSwing();
                        }
                    }
                }
                else if (currentTrick) {
                    trickTime += dt;
                    const progress = Math.min(trickTime / currentTrick.duration, 1.0);
                    const ease = progress < 0.5
                        ? 2 * progress * progress
                        : 1 - Math.pow(-2 * progress + 2, 2) / 2;

                    const baseYaw = facingDir === 1 ? 0 : Math.PI;
                    const worldSwingDir = (currentTrick.relReleaseDir || 1) * facingDir;

                    if (currentTrick.type === 'swing') {
                        const prevAngle = currentBarAngle;
                        currentBarAngle = Math.sin(progress * Math.PI * 2) * currentTrick.amplitude * facingDir;
                        barPivot.rotation.x = currentBarAngle;
                        const angVelNorm = THREE.MathUtils.clamp(((currentBarAngle - prevAngle) / Math.max(dt, 0.001)) * 0.22, -1.2, 1.2);
                        applySwingBiomechanics(currentBarAngle, angVelNorm, 0);
                    }
                    else if (currentTrick.type === 'giant') {
                        const nextTrick = (isPlayingCombo && comboIndex + 1 < comboQueue.length) ? comboQueue[comboIndex + 1] : null;
                        const giantOutputDir = -currentTrick.direction * facingDir;
                        const nextMatchesGiant = nextTrick && nextTrick.relReleaseDir && ((nextTrick.relReleaseDir * facingDir) === giantOutputDir);

                        if (currentTrick.fromHandstandDrop) {
                            // שלב ב': נפילת כבידה טבעית ורציפה מעמידת ידיים לתוך Back Giant
                            const startAngle = Math.PI * facingDir;
                            const endAngle = Math.PI * 2 * facingDir;
                            const gravDropCurve = 0.5 - 0.5 * Math.cos(Math.pow(progress, 0.88) * Math.PI);
                            currentBarAngle = THREE.MathUtils.lerp(startAngle, endAngle, gravDropCurve);
                            barPivot.rotation.x = currentBarAngle;
                            const giantPhase = Math.sin(gravDropCurve * Math.PI);
                            applySwingBiomechanics(giantPhase * 0.65, giantPhase * 0.85, 0);
                            if (progress >= 1.0) currentBarAngle = 0;
                        }
                        else if (nextMatchesGiant) {
                            let nextMag = 1.45;
                            if (nextTrick.type === 'dismount') nextMag = 1.65;
                            else if (nextTrick.type === 'release') nextMag = 1.55;
                            else if (nextTrick.type === 'spin') nextMag = 1.32 + Math.min((nextTrick.degrees / 1260) * 0.45, 0.45);

                            const targetNextRelease = -giantOutputDir * nextMag;
                            const totalSweep = (currentTrick.direction * facingDir * Math.PI * 2) + targetNextRelease;
                            const flowCurve = 0.65 * progress + 0.35 * ease;
                            currentBarAngle = flowCurve * totalSweep;
                            barPivot.rotation.x = currentBarAngle;

                            const giantPhase = Math.sin(flowCurve * Math.PI * 2);
                            const whipOut = progress > 0.72 ? Math.sin(((progress - 0.72) / 0.28) * Math.PI) * giantOutputDir : 0;
                            applySwingBiomechanics(giantPhase * 0.7, giantPhase * 0.85, whipOut);
                        } else {
                            currentBarAngle = currentTrick.direction * facingDir * ease * Math.PI * 2;
                            barPivot.rotation.x = currentBarAngle;
                            const giantPhase = Math.sin(ease * Math.PI * 2);
                            applySwingBiomechanics(giantPhase * 0.7, giantPhase * 0.8, 0);
                            if (progress >= 1.0) currentBarAngle = 0;
                        }
                    }
                    else if (currentTrick.type === 'spin') {
                        setAirBiomechanics('spin_tight', progress);

                        const currentZ = THREE.MathUtils.lerp(releaseAthletePos.z, catchAthletePos.z, progress);
                        const parabolicY = evaluateParabolicY(flightKinematics, trickTime);
                        const outPushZ = worldSwingDir * Math.sin(progress * Math.PI) * 0.26;

                        athlete.position.set(0, parabolicY, currentZ + outPushZ);

                        const targetPitch = catchTargetBarAngle;
                        const pitchEnvelope = Math.sin(progress * Math.PI);
                        const blendedPitch = THREE.MathUtils.lerp(releasePitchX, targetPitch, ease) * (1 - pitchEnvelope * 0.85);
                        bodyMeshGroup.rotation.x = blendedPitch;

                        const totalRad = (currentTrick.degrees * Math.PI) / 180;
                        bodyMeshGroup.rotation.y = baseYaw + ease * totalRad;
                    }
                    else if (currentTrick.type === 'release') {
                        const currentZ = THREE.MathUtils.lerp(releaseAthletePos.z, catchAthletePos.z, progress);
                        const parabolicY = evaluateParabolicY(flightKinematics, trickTime);

                        if (currentTrick.straddle) {
                            setAirBiomechanics('straddle_dynamic', progress, 1.0);

                            athlete.position.set(0, parabolicY, currentZ);

                            const straddleEnv = Math.sin(progress * Math.PI);
                            const archPitch = -worldSwingDir * 0.22 * straddleEnv;
                            bodyMeshGroup.rotation.x = THREE.MathUtils.lerp(releasePitchX, catchTargetBarAngle, ease) + archPitch;
                            bodyMeshGroup.rotation.y = baseYaw;
                        } else {
                            setAirBiomechanics('tuck_progressive', progress);

                            let extraZ = 0;
                            if (!currentTrick.crossBar) {
                                const outDist = currentTrick.extraOutZ || 0.58;
                                extraZ = worldSwingDir * Math.sin(progress * Math.PI) * outDist;
                            }

                            athlete.position.set(0, parabolicY, currentZ + extraZ);

                            const flipDirection = currentTrick.flips * facingDir;
                            bodyMeshGroup.rotation.x = releasePitchX * (1 - ease) + ease * flipDirection * Math.PI * 2;
                            bodyMeshGroup.rotation.y = baseYaw + ease * currentTrick.twists * Math.PI * 2;
                        }
                    }
                    else if (currentTrick.type === 'dismount') {
                        const targetZ = worldSwingDir * currentTrick.dist;
                        const currentZ = THREE.MathUtils.lerp(releaseAthletePos.z, targetZ, progress);
                        const parabolicY = evaluateParabolicY(flightKinematics, trickTime);

                        athlete.position.set(0, parabolicY, currentZ);

                        if (currentTrick.tuck === false) {
                            setAirBiomechanics('layout_hollow', progress);
                        } else {
                            setAirBiomechanics('tuck_progressive', progress);
                        }

                        const rotProgress = Math.min(progress / 0.88, 1.0);
                        const rotEase = rotProgress < 0.5
                            ? 2 * rotProgress * rotProgress
                            : 1 - Math.pow(-2 * rotProgress + 2, 2) / 2;

                        const flipSign = currentTrick.flips * facingDir;
                        const isFrontExitFlip = (currentTrick.relReleaseDir === -1 && currentTrick.flips > 0) ||
                                                (currentTrick.relReleaseDir === 1 && currentTrick.flips < 0);
                        const targetEndYaw = isFrontExitFlip
                            ? (worldSwingDir === 1 ? 0 : Math.PI)
                            : (worldSwingDir === 1 ? Math.PI : 0);

                        bodyMeshGroup.rotation.x = releasePitchX * (1 - rotEase) + rotEase * flipSign * Math.PI * 2;
                        bodyMeshGroup.rotation.y = THREE.MathUtils.lerp(baseYaw, targetEndYaw, rotEase) + rotEase * currentTrick.twists * Math.PI * 2;
                    }

                    if (progress >= 1.0) {
                        onTrickComplete();
                    }
                }

                if (cameraMode === 'follow' && bodyMeshGroup) {
                    const worldPos = new THREE.Vector3();
                    bodyMeshGroup.getWorldPosition(worldPos);
                    controls.target.lerp(worldPos, 0.14);
                }

                const { w, h } = getViewportSize();
                if (w !== lastSize.w || h !== lastSize.h) {
                    lastSize = { w, h };
                    camera.aspect = w / h;
                    camera.updateProjectionMatrix();
                    renderer.setSize(w, h, false);
                }

                controls.update();
                renderer.render(scene, camera);
            } catch (err) {
                console.error("Animate Loop Error:", err);
            }
        }

        // ==========================================
        // 7. ממשק משתמש וניהול קומבואים (UI & Combo Logic)
        // ==========================================
        function switchTab(tabName) {
            activeTab = tabName;
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('bg-blue-600', 'bg-purple-600', 'bg-amber-600', 'text-white');
                btn.classList.add('bg-slate-800');
                if (btn.id === 'tab-statics') btn.classList.add('text-purple-300');
                else if (btn.id === 'tab-strength') btn.classList.add('text-amber-300');
                else btn.classList.add('text-slate-300');
            });
            const activeBtn = document.getElementById(`tab-${tabName}`);
            activeBtn.classList.remove('bg-slate-800', 'text-slate-300', 'text-purple-300', 'text-amber-300');
            if (tabName === 'statics') activeBtn.classList.add('bg-purple-600', 'text-white');
            else if (tabName === 'strength') activeBtn.classList.add('bg-amber-600', 'text-white');
            else activeBtn.classList.add('bg-blue-600', 'text-white');

            renderTricks();
        }

        function renderTricks() {
            const grid = document.getElementById('tricks-container');
            grid.innerHTML = '';

            TRICKS[activeTab].forEach(trick => {
                const card = document.createElement('div');
                card.className = 'group relative flex items-center justify-between bg-slate-800/90 hover:bg-slate-700/90 border border-slate-700 hover:border-cyan-500/60 rounded-xl px-2 py-1.5 transition cursor-pointer';
                
                card.onclick = () => {
                    isPlayingCombo = false;
                    startTrick(trick);
                };

                card.innerHTML = `
                    <div class="pr-0.5 min-w-0">
                        <div class="text-[11px] font-bold text-slate-100 group-hover:text-cyan-300 transition truncate">${trick.name}</div>
                        <div class="text-[9px] text-slate-400 truncate">${trick.sub}</div>
                    </div>
                    <button type="button" title="הוסף לרצף" class="w-6 h-6 rounded-md bg-slate-900/90 hover:bg-cyan-600 text-cyan-400 hover:text-white font-bold text-xs flex items-center justify-center border border-slate-700 transition shrink-0 mr-1 cursor-pointer">
                        +
                    </button>
                `;

                const addBtn = card.querySelector('button');
                addBtn.onclick = (e) => {
                    e.stopPropagation();
                    addToCombo(trick);
                };

                grid.appendChild(card);
            });
        }

        function toggleTricksPanelSize() {
            isTricksExpanded = !isTricksExpanded;
            const panel = document.getElementById('tricks-panel');
            const grid = document.getElementById('tricks-container');
            const icon = document.getElementById('toggle-tricks-icon');
            const text = document.getElementById('toggle-tricks-text');

            if (isTricksExpanded) {
                panel.classList.remove('max-w-xl', 'p-2.5');
                panel.classList.add('max-w-3xl', 'p-4');
                grid.classList.remove('max-h-[96px]', 'sm:grid-cols-3');
                grid.classList.add('max-h-[240px]', 'sm:grid-cols-3', 'md:grid-cols-4');
                icon.textContent = '⤡';
                text.textContent = 'הקטן';
            } else {
                panel.classList.remove('max-w-3xl', 'p-4', 'md:grid-cols-4');
                panel.classList.add('max-w-xl', 'p-2.5');
                grid.classList.remove('max-h-[240px]', 'md:grid-cols-4');
                grid.classList.add('max-h-[96px]', 'sm:grid-cols-3');
                icon.textContent = '⤢';
                text.textContent = 'הגדל';
            }
        }

        function addToCombo(trick) {
            comboQueue.push(trick);
            renderComboQueue();
        }

        function removeFromCombo(index) {
            comboQueue.splice(index, 1);
            renderComboQueue();
        }

        function clearCombo() {
            comboQueue = [];
            isPlayingCombo = false;
            renderComboQueue();
        }

        function renderComboQueue() {
            const list = document.getElementById('combo-list');
            const playBtn = document.getElementById('btn-play-combo');

            if (comboQueue.length === 0) {
                list.innerHTML = '<span class="text-xs text-slate-500 italic">לחץ על + ליד תרגילים כדי לבנות רצף...</span>';
                playBtn.disabled = true;
                return;
            }

            playBtn.disabled = false;
            list.innerHTML = '';

            comboQueue.forEach((trick, idx) => {
                const pill = document.createElement('span');
                pill.className = 'inline-flex items-center gap-1.5 px-2 py-0.5 rounded-lg text-[11px] font-medium bg-cyan-950/90 text-cyan-200 border border-cyan-700/60';
                pill.innerHTML = `
                    <span>${idx + 1}. ${trick.name}</span>
                    <button type="button" class="text-cyan-400 hover:text-rose-400 font-bold ml-0.5 cursor-pointer">&times;</button>
                `;
                pill.querySelector('button').onclick = () => removeFromCombo(idx);
                list.appendChild(pill);
            });
        }

        function playCombo() {
            if (comboQueue.length === 0) return;
            isPlayingCombo = true;
            comboIndex = 0;
            startTrick(comboQueue[0]);
        }

        function setCameraView(view) {
            cameraMode = view;
            const followBtn = document.getElementById('btn-follow');
            followBtn.classList.remove('bg-blue-600', 'text-white');

            if (view === 'side') {
                controls.target.set(0, 3.6, 0);
                camera.position.set(11.5, 4.2, 0);
            } else if (view === 'threeQuarter') {
                controls.target.set(0, 3.6, 0);
                camera.position.set(9.2, 4.8, 7.2);
            } else if (view === 'follow') {
                followBtn.classList.add('bg-blue-600', 'text-white');
            }
        }

        function toggleSlowMo() {
            const btn = document.getElementById('btn-slowmo');
            if (slowMoFactor === 1.0) {
                slowMoFactor = 0.5;
                btn.textContent = 'הילוך איטי: 0.5x';
                btn.classList.add('border-amber-500', 'text-amber-300');
            } else if (slowMoFactor === 0.5) {
                slowMoFactor = 0.25;
                btn.textContent = 'הילוך איטי: 0.25x';
            } else {
                slowMoFactor = 1.0;
                btn.textContent = 'הילוך איטי: 1.0x';
                btn.classList.remove('border-amber-500', 'text-amber-300');
            }
        }

        function handleResize() {
            if (!camera || !renderer) return;
            const { w, h } = getViewportSize();
            if (w > 0 && h > 0) {
                lastSize = { w, h };
                camera.aspect = w / h;
                camera.updateProjectionMatrix();
                renderer.setSize(w, h, false);
            }
        }

        window.addEventListener('resize', handleResize);
        window.addEventListener('DOMContentLoaded', () => {
            renderTricks();
            renderComboQueue();
            initScene();
        });
        window.addEventListener('load', () => {
            initScene();
            handleResize();
        });

        renderTricks();
        renderComboQueue();
        initScene();
    </script>
</body>
</html>
