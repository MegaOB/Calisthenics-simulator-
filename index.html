<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>סימולטור קליסטניקס תלת-ממדי (3D Calisthenics Simulator)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #0f172a; font-family: system-ui, -apple-system, sans-serif; }
        #canvas-container { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 0; }
        canvas { display: block; width: 100%; height: 100%; }
        .glass-panel {
            background: rgba(15, 23, 42, 0.86);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.2); }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.25); border-radius: 3px; }
    </style>
</head>
<body class="text-slate-100 select-none">

    <!-- 3D Canvas Container -->
    <div id="canvas-container"></div>

    <!-- Top Status & Controls Header -->
    <div class="fixed top-4 left-4 right-4 z-10 flex flex-wrap items-center justify-between gap-3 pointer-events-none">
        <!-- Title & State Badge -->
        <div class="glass-panel rounded-2xl px-4 py-3 flex items-center gap-4 pointer-events-auto shadow-xl">
            <div>
                <h1 class="text-lg font-bold bg-gradient-to-l from-cyan-400 to-blue-500 bg-clip-text text-transparent">
                    סימולטור פריסטייל מתח 3D
                </h1>
                <p class="text-xs text-slate-400">גרור לסיבוב מצלמה • גלגל לזום</p>
            </div>
            <div class="h-8 w-px bg-slate-700"></div>
            <div class="flex flex-col">
                <span class="text-[10px] uppercase tracking-wider text-slate-400">מצב נוכחי</span>
                <span id="state-badge" class="text-sm font-semibold text-emerald-400">אחיזה במתח (Idle)</span>
            </div>
            <div class="flex flex-col">
                <span class="text-[10px] uppercase tracking-wider text-slate-400">תרגיל פעיל</span>
                <span id="current-move-badge" class="text-sm font-semibold text-cyan-300">-</span>
            </div>
            <div class="flex flex-col">
                <span class="text-[10px] uppercase tracking-wider text-slate-400">כיוון מבט</span>
                <span id="facing-badge" class="text-xs font-bold text-amber-300">קדימה (+Z)</span>
            </div>
        </div>

        <!-- Camera & Speed Controls -->
        <div class="glass-panel rounded-2xl px-4 py-2.5 flex items-center gap-2 pointer-events-auto shadow-xl">
            <button onclick="setCameraView('side')" class="px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-800 hover:bg-slate-700 border border-slate-700 transition">מבט צד</button>
            <button onclick="setCameraView('threeQuarter')" class="px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-800 hover:bg-slate-700 border border-slate-700 transition">3/4 דינמי</button>
            <button onclick="setCameraView('follow')" id="btn-follow" class="px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-800 hover:bg-slate-700 border border-slate-700 transition">מעקב אתלט</button>
            <div class="h-6 w-px bg-slate-700 mx-1"></div>
            <button onclick="toggleSlowMo()" id="btn-slowmo" class="px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-800 hover:bg-slate-700 border border-slate-700 transition">הילוך איטי: 1.0x</button>
            <button onclick="resetAthlete()" class="px-3 py-1.5 rounded-lg text-xs font-bold bg-rose-600/80 hover:bg-rose-500 text-white transition">איפוס למתח</button>
        </div>
    </div>

    <!-- Bottom Controls & Combo Queue -->
    <div class="fixed bottom-4 left-4 right-4 z-10 flex flex-col lg:flex-row items-stretch lg:items-end justify-between gap-4 pointer-events-none">
        
        <!-- Tricks Selection Panel -->
        <div class="glass-panel rounded-2xl p-4 pointer-events-auto shadow-2xl max-w-3xl w-full">
            <!-- Category Tabs -->
            <div class="flex flex-wrap items-center justify-between gap-2 mb-3 border-b border-slate-700/80 pb-2">
                <div class="flex gap-2">
                    <button onclick="switchTab('swing')" id="tab-swing" class="tab-btn px-3 py-1 rounded-lg text-xs font-bold bg-blue-600 text-white transition">תנופה (Swings)</button>
                    <button onclick="switchTab('spins')" id="tab-spins" class="tab-btn px-3 py-1 rounded-lg text-xs font-bold bg-slate-800 text-slate-300 hover:bg-slate-700 transition">סיבובים (Spins)</button>
                    <button onclick="switchTab('releases')" id="tab-releases" class="tab-btn px-3 py-1 rounded-lg text-xs font-bold bg-slate-800 text-slate-300 hover:bg-slate-700 transition">עזיבות (Releases)</button>
                    <button onclick="switchTab('dismounts')" id="tab-dismounts" class="tab-btn px-3 py-1 rounded-lg text-xs font-bold bg-slate-800 text-slate-300 hover:bg-slate-700 transition">ירידות (Dismounts)</button>
                </div>
                <span class="text-[11px] text-slate-400">לחיצה מפעילה עם סווינג • <span class="text-cyan-400 font-bold">+</span> מוסיף לרצף</span>
            </div>

            <!-- Tricks Grid -->
            <div id="tricks-container" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-2 max-h-[155px] overflow-y-auto pr-1">
                <!-- Populated by JS -->
            </div>
        </div>

        <!-- Combo Builder Panel -->
        <div class="glass-panel rounded-2xl p-4 pointer-events-auto shadow-2xl w-full lg:w-96 flex flex-col justify-between">
            <div class="flex items-center justify-between mb-2">
                <span class="text-xs font-bold text-slate-200">בניית רצף (Combo Queue)</span>
                <button onclick="clearCombo()" class="text-[11px] text-rose-400 hover:text-rose-300">נקה רצף</button>
            </div>
            
            <div id="combo-list" class="flex flex-wrap gap-1.5 min-h-[42px] max-h-[84px] overflow-y-auto bg-slate-950/60 rounded-xl p-2 border border-slate-800 mb-3 items-center">
                <span class="text-xs text-slate-500 italic">לחץ על + ליד תרגילים כדי לבנות רצף...</span>
            </div>

            <button onclick="playCombo()" id="btn-play-combo" class="w-full py-2.5 rounded-xl font-bold text-sm bg-gradient-to-l from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-white shadow-lg transition disabled:opacity-40 disabled:cursor-not-allowed">
                ▶ בצע רצף תרגילים
            </button>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. מאגר התרגילים (Tricks Database)
        // ==========================================
        const TRICKS = {
            swing: [
                { id: 'tap_swing', name: 'Tap Swing', sub: 'תנופה קדימה ואחורה', type: 'swing', duration: 1.35, amplitude: 0.9 },
                { id: 'giant_back', name: 'Back Giant', sub: 'סיבוב מלא אחורה', type: 'giant', direction: 1, duration: 1.45 },
                { id: 'giant_front', name: 'Front Giant', sub: 'סיבוב מלא קדימה', type: 'giant', direction: -1, duration: 1.45 }
            ],
            spins: [
                { id: 'spin_180', name: '180 Spin', sub: 'סווינג קדימה (+Z יחסי)', type: 'spin', relReleaseDir: 1, degrees: 180, height: 0.42, duration: 0.72 },
                { id: 'spin_360', name: '360 Spin', sub: 'סווינג אחורה (-Z יחסי)', type: 'spin', relReleaseDir: -1, degrees: 360, height: 0.48, duration: 0.78 },
                { id: 'spin_540', name: '540 Spin', sub: 'סווינג קדימה (+Z יחסי)', type: 'spin', relReleaseDir: 1, degrees: 540, height: 0.54, duration: 0.85 },
                { id: 'spin_720', name: '720 Spin', sub: 'סווינג אחורה (-Z יחסי)', type: 'spin', relReleaseDir: -1, degrees: 720, height: 0.60, duration: 0.92 },
                { id: 'spin_900', name: '900 Spin', sub: 'סווינג קדימה (+Z יחסי)', type: 'spin', relReleaseDir: 1, degrees: 900, height: 0.66, duration: 1.02 },
                { id: 'spin_1080', name: '1080 Spin', sub: 'סווינג אחורה (-Z יחסי)', type: 'spin', relReleaseDir: -1, degrees: 1080, height: 0.72, duration: 1.12 },
                { id: 'spin_1260', name: '1260 Spin', sub: 'סווינג קדימה (+Z יחסי)', type: 'spin', relReleaseDir: 1, degrees: 1260, height: 0.78, duration: 1.22 }
            ],
            releases: [
                { id: 'gienger', name: 'Gienger', sub: 'סווינג קדימה • Tucked • 180', type: 'release', crossBar: false, relReleaseDir: 1, flips: -1, twists: 0.5, peakHeight: 1.05, duration: 1.08 },
                { id: 'frisbee', name: 'Frisbee', sub: 'סווינג אחורה • Tucked • 360', type: 'release', crossBar: false, relReleaseDir: -1, flips: -1, twists: 1.0, peakHeight: 1.15, duration: 1.12 },
                { id: 'tkatchev', name: 'Straddle Tkatchev', sub: 'מעבר מעל המתח • פיסוק רגליים', type: 'release', crossBar: true, straddle: true, relReleaseDir: 1, flips: 0, twists: 0, peakHeight: 1.35, duration: 1.02 },
                { id: 'iceball_regrab', name: 'Iceball Regrab', sub: 'סווינג אחורה • סלטה קדמית + תפיסה', type: 'release', crossBar: false, relReleaseDir: -1, flips: 1, twists: 0, peakHeight: 1.45, extraOutZ: 0.65, duration: 1.08 },
                { id: 'b2b_regrab', name: 'B2B Regrab', sub: 'סווינג אחורה • סלטה אחורית + תפיסה', type: 'release', crossBar: false, relReleaseDir: -1, flips: -1, twists: 0, peakHeight: 1.45, extraOutZ: 0.65, duration: 1.08 },
                { id: 'fireball_regrab', name: 'Fireball Regrab', sub: 'סווינג קדימה • סלטה קדמית + תפיסה', type: 'release', crossBar: false, relReleaseDir: 1, flips: 1, twists: 0, peakHeight: 1.45, extraOutZ: 0.65, duration: 1.08 }
            ],
            dismounts: [
                { id: 'b2b', name: 'B2B', sub: 'סווינג אחורה (-Z יחסי)', type: 'dismount', relReleaseDir: -1, flips: -1, twists: 0, tuck: true, dist: 3.3, peakHeight: 0.95, duration: 1.18 },
                { id: 'layout_b2b', name: 'Layout B2B', sub: 'סווינג אחורה • גוף ישר', type: 'dismount', relReleaseDir: -1, flips: -1, twists: 0, tuck: false, dist: 3.8, peakHeight: 1.1, duration: 1.22 },
                { id: '360_b2b', name: '360 B2B', sub: 'סווינג אחורה • בורג 360', type: 'dismount', relReleaseDir: -1, flips: -1, twists: 1, tuck: true, dist: 3.6, peakHeight: 1.15, duration: 1.25 },
                { id: 'iceball', name: 'Iceball', sub: 'סווינג אחורה • סלטה קדמית', type: 'dismount', relReleaseDir: -1, flips: 1, twists: 0, tuck: true, dist: 3.4, peakHeight: 1.05, duration: 1.18 },
                { id: 'gainer', name: 'Gainer', sub: 'סווינג קדימה (+Z יחסי)', type: 'dismount', relReleaseDir: 1, flips: -1, twists: 0, tuck: true, dist: 3.3, peakHeight: 0.95, duration: 1.18 },
                { id: 'layout_gainer', name: 'Layout Gainer', sub: 'סווינג קדימה • גוף ישר', type: 'dismount', relReleaseDir: 1, flips: -1, twists: 0, tuck: false, dist: 3.8, peakHeight: 1.1, duration: 1.22 },
                { id: 'full_twist_gainer', name: 'Full Twist Gainer', sub: 'סווינג קדימה • בורג 360', type: 'dismount', relReleaseDir: 1, flips: -1, twists: 1, tuck: true, dist: 3.6, peakHeight: 1.15, duration: 1.25 },
                { id: 'fireball', name: 'Fireball', sub: 'סווינג קדימה • סלטה קדמית', type: 'dismount', relReleaseDir: 1, flips: 1, twists: 0, tuck: true, dist: 3.4, peakHeight: 1.05, duration: 1.18 }
            ]
        };

        // ==========================================
        // 2. משתנים גלובליים והגדרות סצנה
        // ==========================================
        let scene, camera, renderer, controls;
        let barPivot, athlete, bodyMeshGroup, leftArm, rightArm, leftLeg, rightLeg, torso;

        const BAR_HEIGHT = 5.0;
        const MAT_HEIGHT = 0.35;
        const ATHLETE_HEIGHT = 1.85;
        const COM_OFFSET_Y = -0.95;
        const LANDED_ATHLETE_Y = -(BAR_HEIGHT - MAT_HEIGHT - ATHLETE_HEIGHT); // -2.80

        let state = 'idle';
        let currentTrick = null;
        let trickTime = 0;
        let slowMoFactor = 1.0;
        let cameraMode = 'threeQuarter';
        let facingDir = 1;

        let currentBarAngle = 0;
        let swingStartAngle = 0;
        let swingTargetAngle = 0;
        let swingDuration = 0.65;
        let swingTime = 0;

        let releaseAthletePos = new THREE.Vector3();
        let releasePitchX = 0;
        let catchAthletePos = new THREE.Vector3();
        let catchTargetBarAngle = 0;

        let comboQueue = [];
        let isPlayingCombo = false;
        let comboIndex = 0;
        let idleTime = 0;
        let activeTab = 'swing';
        let isInitialized = false;
        let clock;

        function getViewportSize() {
            const w = window.innerWidth || document.documentElement.clientWidth || 1024;
            const h = window.innerHeight || document.documentElement.clientHeight || 768;
            return { w, h };
        }

        function initScene() {
            if (isInitialized) return;
            if (typeof THREE === 'undefined') {
                setTimeout(initScene, 50);
                return;
            }
            isInitialized = true;

            const container = document.getElementById('canvas-container');
            const { w, h } = getViewportSize();

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0b1120);
            scene.fog = new THREE.FogExp2(0x0b1120, 0.018);

            camera = new THREE.PerspectiveCamera(48, w / h, 0.1, 100);
            camera.position.set(9.2, 4.8, 7.2);

            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(w, h);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.innerHTML = '';
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.target.set(0, 3.6, 0);
            controls.enableDamping = true;
            controls.dampingFactor = 0.06;
            controls.maxPolarAngle = Math.PI / 2 - 0.02;
            controls.minDistance = 2.5;
            controls.maxDistance = 26;

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xdbeafe, 0.7);
            scene.add(ambientLight);

            const mainLight = new THREE.DirectionalLight(0xffffff, 1.15);
            mainLight.position.set(8, 16, 10);
            mainLight.castShadow = true;
            mainLight.shadow.mapSize.width = 2048;
            mainLight.shadow.mapSize.height = 2048;
            mainLight.shadow.camera.near = 1;
            mainLight.shadow.camera.far = 45;
            const d = 14;
            mainLight.shadow.camera.left = -d;
            mainLight.shadow.camera.right = d;
            mainLight.shadow.camera.top = d;
            mainLight.shadow.camera.bottom = -d;
            scene.add(mainLight);

            const rimLight = new THREE.DirectionalLight(0x38bdf8, 0.45);
            rimLight.position.set(-10, 8, -10);
            scene.add(rimLight);

            // Floor & Grid
            const floor = new THREE.Mesh(
                new THREE.PlaneGeometry(60, 60),
                new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.85, metalness: 0.1 })
            );
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            const gridHelper = new THREE.GridHelper(60, 60, 0x334155, 0x1e293b);
            gridHelper.position.y = 0.01;
            scene.add(gridHelper);

            // Landing Mat (24m length, 3.6m width)
            const landingMat = new THREE.Mesh(
                new THREE.BoxGeometry(3.6, MAT_HEIGHT, 24.0),
                new THREE.MeshStandardMaterial({ color: 0x1d4ed8, roughness: 0.6, metalness: 0.05 })
            );
            landingMat.position.set(0, MAT_HEIGHT / 2, 0);
            landingMat.receiveShadow = true;
            landingMat.castShadow = true;
            scene.add(landingMat);

            const lineMat = new THREE.MeshBasicMaterial({ color: 0x93c5fd });
            for (let z = -10; z <= 10; z += 2) {
                const stripe = new THREE.Mesh(new THREE.PlaneGeometry(3.5, z === 0 ? 0.12 : 0.05), lineMat);
                stripe.rotation.x = -Math.PI / 2;
                stripe.position.set(0, MAT_HEIGHT + 0.005, z);
                scene.add(stripe);
            }

            // High Bar & Pillars
            const pillarMat = new THREE.MeshStandardMaterial({ color: 0x475569, roughness: 0.4, metalness: 0.7 });
            const barMat = new THREE.MeshStandardMaterial({ color: 0xe2e8f0, roughness: 0.25, metalness: 0.9 });

            const pillarGeo = new THREE.CylinderGeometry(0.08, 0.11, BAR_HEIGHT, 16);
            [-1.6, 1.6].forEach(xPos => {
                const pillar = new THREE.Mesh(pillarGeo, pillarMat);
                pillar.position.set(xPos, BAR_HEIGHT / 2, 0);
                pillar.castShadow = true;
                scene.add(pillar);

                const base = new THREE.Mesh(new THREE.BoxGeometry(0.45, 0.08, 0.45), pillarMat);
                base.position.set(xPos, 0.04, 0);
                scene.add(base);
            });

            const highBarGeo = new THREE.CylinderGeometry(0.024, 0.024, 3.3, 24);
            highBarGeo.rotateZ(Math.PI / 2);
            const highBar = new THREE.Mesh(highBarGeo, barMat);
            highBar.position.set(0, BAR_HEIGHT, 0);
            highBar.castShadow = true;
            scene.add(highBar);

            // Athlete Hierarchy
            barPivot = new THREE.Group();
            barPivot.position.set(0, BAR_HEIGHT, 0);
            scene.add(barPivot);

            athlete = new THREE.Group();
            barPivot.add(athlete);

            const skinMat = new THREE.MeshStandardMaterial({ color: 0xf1c27d, roughness: 0.5 });
            const shirtMat = new THREE.MeshStandardMaterial({ color: 0x0ea5e9, roughness: 0.6 });
            const chestStripeMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.4 });
            const shortsMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.7 });
            const shoeMat = new THREE.MeshStandardMaterial({ color: 0xf43f5e, roughness: 0.5 });
            const wristWrapMat = new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.8 });

            bodyMeshGroup = new THREE.Group();
            bodyMeshGroup.position.set(0, COM_OFFSET_Y, 0);
            athlete.add(bodyMeshGroup);

            torso = new THREE.Mesh(new THREE.BoxGeometry(0.36, 0.52, 0.20), shirtMat);
            torso.position.set(0, 0.16, 0);
            torso.castShadow = true;
            bodyMeshGroup.add(torso);

            const frontStripe = new THREE.Mesh(new THREE.BoxGeometry(0.10, 0.48, 0.02), chestStripeMat);
            frontStripe.position.set(0, 0.16, 0.105);
            bodyMeshGroup.add(frontStripe);

            const headGroup = new THREE.Group();
            headGroup.position.set(0, 0.54, 0);
            const head = new THREE.Mesh(new THREE.SphereGeometry(0.115, 20, 20), skinMat);
            head.castShadow = true;
            headGroup.add(head);

            const visor = new THREE.Mesh(
                new THREE.BoxGeometry(0.16, 0.04, 0.06),
                new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.2 })
            );
            visor.position.set(0, 0.01, 0.095);
            headGroup.add(visor);
            bodyMeshGroup.add(headGroup);

            function createArm(side) {
                const armPivot = new THREE.Group();
                armPivot.position.set(side * 0.23, 0.38, 0);

                const armMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.038, 0.54, 14), skinMat);
                armMesh.position.set(0, 0.27, 0);
                armMesh.castShadow = true;
                armPivot.add(armMesh);

                const wrapMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.043, 0.043, 0.08, 14), wristWrapMat);
                wrapMesh.position.set(0, 0.49, 0);
                armPivot.add(wrapMesh);

                const handMesh = new THREE.Mesh(new THREE.SphereGeometry(0.048, 12, 12), skinMat);
                handMesh.position.set(0, 0.57, 0);
                armPivot.add(handMesh);

                return armPivot;
            }

            leftArm = createArm(-1);
            rightArm = createArm(1);
            bodyMeshGroup.add(leftArm);
            bodyMeshGroup.add(rightArm);

            const pelvis = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.22, 0.21), shortsMat);
            pelvis.position.set(0, -0.18, 0);
            pelvis.castShadow = true;
            bodyMeshGroup.add(pelvis);

            function createLeg(side) {
                const hipPivot = new THREE.Group();
                hipPivot.position.set(side * 0.105, -0.26, 0);

                const thigh = new THREE.Mesh(new THREE.CylinderGeometry(0.068, 0.055, 0.36, 14), shortsMat);
                thigh.position.set(0, -0.16, 0);
                thigh.castShadow = true;
                hipPivot.add(thigh);

                const calf = new THREE.Mesh(new THREE.CylinderGeometry(0.052, 0.038, 0.36, 14), skinMat);
                calf.position.set(0, -0.48, 0);
                calf.castShadow = true;
                hipPivot.add(calf);

                const shoe = new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.06, 0.19), shoeMat);
                shoe.position.set(0, -0.61, 0.035);
                shoe.castShadow = true;
                hipPivot.add(shoe);

                return hipPivot;
            }

            leftLeg = createLeg(-1);
            rightLeg = createLeg(1);
            bodyMeshGroup.add(leftLeg);
            bodyMeshGroup.add(rightLeg);

            clock = new THREE.Clock();
            handleResize();
            animate();
        }

        // ==========================================
        // 3. מכונת מצבים, סווינגים יחסיים ופיזיקה
        // ==========================================
        function updateFacingBadge() {
            const badge = document.getElementById('facing-badge');
            if (facingDir === 1) {
                badge.textContent = 'קדימה (+Z)';
                badge.className = 'text-xs font-bold text-amber-300';
            } else {
                badge.textContent = 'אחורה (-Z)';
                badge.className = 'text-xs font-bold text-pink-400';
            }
        }

        function updateUIState(stateText, moveText = '-') {
            const badge = document.getElementById('state-badge');
            badge.textContent = stateText;
            document.getElementById('current-move-badge').textContent = moveText;

            badge.className = 'text-sm font-semibold ';
            if (state === 'idle') badge.className += 'text-emerald-400';
            else if (state === 'prep_swing' || state === 'swinging') badge.className += 'text-amber-400';
            else if (state === 'flying' || state === 'dismounting') badge.className += 'text-cyan-400';
            else if (state === 'landed') badge.className += 'text-purple-400';
        }

        function setBodyPose(pose, straddleAmount = 1.0) {
            if (!leftArm) return;
            if (pose === 'hang') {
                leftArm.rotation.set(0, 0, 0);
                rightArm.rotation.set(0, 0, 0);
                leftLeg.rotation.set(0, 0, 0);
                rightLeg.rotation.set(0, 0, 0);
                torso.rotation.set(0, 0, 0);
            } else if (pose === 'tuck') {
                leftLeg.rotation.set(-1.55, 0, 0);
                rightLeg.rotation.set(-1.55, 0, 0);
                leftArm.rotation.set(-2.35, 0, -0.15);
                rightArm.rotation.set(-2.35, 0, 0.15);
            } else if (pose === 'straddle') {
                leftLeg.rotation.set(-0.65 * straddleAmount, 0, -0.82 * straddleAmount);
                rightLeg.rotation.set(-0.65 * straddleAmount, 0, 0.82 * straddleAmount);
                leftArm.rotation.set(-0.35 * straddleAmount, 0, -0.55 * straddleAmount);
                rightArm.rotation.set(-0.35 * straddleAmount, 0, 0.55 * straddleAmount);
            } else if (pose === 'spin') {
                leftArm.rotation.set(0, 0, -0.22);
                rightArm.rotation.set(0, 0, 0.22);
                leftLeg.rotation.set(0, 0, 0);
                rightLeg.rotation.set(0, 0, 0);
            } else if (pose === 'landed') {
                leftArm.rotation.set(0, 0, -2.1);
                rightArm.rotation.set(0, 0, 2.1);
                leftLeg.rotation.set(0, 0, 0);
                rightLeg.rotation.set(0, 0, 0);
            }
        }

        function resetAthlete(keepCombo = false) {
            state = 'idle';
            currentTrick = null;
            trickTime = 0;
            swingTime = 0;
            currentBarAngle = 0;
            facingDir = 1;
            updateFacingBadge();

            if (!keepCombo) {
                isPlayingCombo = false;
                comboIndex = 0;
            }

            if (barPivot) {
                barPivot.rotation.set(0, 0, 0);
                athlete.position.set(0, 0, 0);
                athlete.rotation.set(0, 0, 0);
                bodyMeshGroup.rotation.set(0, 0, 0);
                setBodyPose('hang');
            }

            updateUIState('אחיזה במתח (Idle)', '-');
        }

        function getDetachedOffsetForBarAngle(angle) {
            const yOffset = COM_OFFSET_Y * (Math.cos(angle) - 1);
            const zOffset = COM_OFFSET_Y * Math.sin(angle);
            return new THREE.Vector3(0, yOffset, zOffset);
        }

        function startTrick(trick) {
            if (!isInitialized) initScene();
            if (state === 'landed') {
                resetAthlete(isPlayingCombo);
            }

            currentTrick = trick;
            trickTime = 0;

            if (trick.type === 'swing' || trick.type === 'giant') {
                state = 'swinging';
                setBodyPose('hang');
                updateUIState('תנופה (Swinging)', trick.name);
                return;
            }

            const worldSwingDir = trick.relReleaseDir * facingDir;
            const swingAngleMag = trick.type === 'dismount' ? 1.05 : (trick.type === 'release' ? 0.95 : 0.72);
            swingTargetAngle = -worldSwingDir * swingAngleMag;

            swingStartAngle = Math.abs(currentBarAngle) > 0.12 ? currentBarAngle : (worldSwingDir * 0.55);
            swingDuration = Math.abs(currentBarAngle) > 0.12 ? 0.42 : 0.62;
            swingTime = 0;

            state = 'prep_swing';
            setBodyPose('hang');
            const dirLabel = trick.relReleaseDir === 1 ? 'סווינג קדימה (+Z יחסי)' : 'סווינג אחורה (-Z יחסי)';
            updateUIState(`הכנת תנופה (${dirLabel})`, trick.name);
        }

        function launchFromSwing() {
            releaseAthletePos.copy(getDetachedOffsetForBarAngle(currentBarAngle));
            releasePitchX = currentBarAngle;

            barPivot.rotation.x = 0;
            athlete.position.copy(releaseAthletePos);
            bodyMeshGroup.rotation.x = releasePitchX;
            bodyMeshGroup.rotation.y = facingDir === 1 ? 0 : Math.PI;

            const worldSwingDir = currentTrick.relReleaseDir * facingDir;

            if (currentTrick.type === 'spin') {
                catchTargetBarAngle = -worldSwingDir * 0.55;
                catchAthletePos.copy(getDetachedOffsetForBarAngle(catchTargetBarAngle));
            } else if (currentTrick.type === 'release') {
                if (currentTrick.crossBar) {
                    catchTargetBarAngle = worldSwingDir * 0.65;
                } else {
                    catchTargetBarAngle = -worldSwingDir * 0.65;
                }
                catchAthletePos.copy(getDetachedOffsetForBarAngle(catchTargetBarAngle));
            }

            trickTime = 0;
            if (currentTrick.type === 'dismount') {
                state = 'dismounting';
                updateUIState('ירידה מהמתח (Dismount)', currentTrick.name);
            } else {
                state = 'flying';
                updateUIState('ריחוף באוויר (Flying)', currentTrick.name);
            }
        }

        function onTrickComplete() {
            const finishedTrick = currentTrick;
            currentTrick = null;
            trickTime = 0;

            if (finishedTrick.type === 'dismount') {
                const worldSwingDir = finishedTrick.relReleaseDir * facingDir;
                const finalLandingZ = worldSwingDir * finishedTrick.dist;

                const isFrontExitFlip = (finishedTrick.relReleaseDir === -1 && finishedTrick.flips > 0) ||
                                        (finishedTrick.relReleaseDir === 1 && finishedTrick.flips < 0);
                const finalYaw = isFrontExitFlip
                    ? (worldSwingDir === 1 ? 0 : Math.PI)
                    : (worldSwingDir === 1 ? Math.PI : 0);

                state = 'landed';
                barPivot.rotation.set(0, 0, 0);
                bodyMeshGroup.rotation.set(0, finalYaw, 0);
                athlete.rotation.set(0, 0, 0);
                athlete.position.set(0, LANDED_ATHLETE_Y, finalLandingZ);
                setBodyPose('landed');
                updateUIState('נחיתה מושלמת (Landed)', finishedTrick.name);
                isPlayingCombo = false;
                return;
            }

            let halfTurns = 0;
            if (finishedTrick.type === 'spin') {
                halfTurns = Math.round(finishedTrick.degrees / 180);
            } else if (finishedTrick.type === 'release') {
                halfTurns = Math.round(finishedTrick.twists * 2);
            }

            if (halfTurns % 2 !== 0) {
                facingDir *= -1;
                updateFacingBadge();
            }

            currentBarAngle = (finishedTrick.type === 'spin' || finishedTrick.type === 'release') ? catchTargetBarAngle : 0;
            barPivot.rotation.set(currentBarAngle, 0, 0);
            athlete.position.set(0, 0, 0);
            athlete.rotation.set(0, 0, 0);
            bodyMeshGroup.rotation.set(0, facingDir === 1 ? 0 : Math.PI, 0);
            setBodyPose('hang');

            if (isPlayingCombo) {
                comboIndex++;
                if (comboIndex < comboQueue.length) {
                    startTrick(comboQueue[comboIndex]);
                    return;
                } else {
                    isPlayingCombo = false;
                }
            }

            state = 'idle';
            updateUIState('אחיזה במתח (Idle)', '-');
        }

        // ==========================================
        // 4. לולאת אנימציה (Animation Loop)
        // ==========================================
        function animate() {
            requestAnimationFrame(animate);
            if (!renderer || !scene || !camera) return;

            const rawDt = Math.min(clock.getDelta(), 0.05);
            const dt = rawDt * slowMoFactor;

            if (state === 'idle') {
                idleTime += dt;
                currentBarAngle = THREE.MathUtils.lerp(currentBarAngle, Math.sin(idleTime * 2.2) * 0.05, dt * 3.5);
                barPivot.rotation.x = currentBarAngle;
                bodyMeshGroup.rotation.y = facingDir === 1 ? 0 : Math.PI;
            }
            else if (state === 'prep_swing' && currentTrick) {
                swingTime += dt;
                const p = Math.min(swingTime / swingDuration, 1.0);
                const ease = p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
                currentBarAngle = THREE.MathUtils.lerp(swingStartAngle, swingTargetAngle, ease);
                barPivot.rotation.x = currentBarAngle;

                if (p >= 1.0) {
                    launchFromSwing();
                }
            }
            else if (currentTrick) {
                trickTime += dt;
                const progress = Math.min(trickTime / currentTrick.duration, 1.0);
                const ease = progress < 0.5
                    ? 2 * progress * progress
                    : 1 - Math.pow(-2 * progress + 2, 2) / 2;

                const baseYaw = facingDir === 1 ? 0 : Math.PI;
                const worldSwingDir = (currentTrick.relReleaseDir || 1) * facingDir;

                if (currentTrick.type === 'swing') {
                    currentBarAngle = Math.sin(progress * Math.PI * 2) * currentTrick.amplitude * facingDir;
                    barPivot.rotation.x = currentBarAngle;
                }
                else if (currentTrick.type === 'giant') {
                    currentBarAngle = currentTrick.direction * facingDir * ease * Math.PI * 2;
                    barPivot.rotation.x = currentBarAngle;
                    if (progress >= 1.0) currentBarAngle = 0;
                }
                else if (currentTrick.type === 'spin') {
                    setBodyPose('spin');

                    const basePos = new THREE.Vector3().lerpVectors(releaseAthletePos, catchAthletePos, ease);
                    const hopY = Math.sin(progress * Math.PI) * currentTrick.height;
                    const outPushZ = worldSwingDir * Math.sin(progress * Math.PI) * 0.28;

                    athlete.position.set(0, basePos.y + hopY, basePos.z + outPushZ);

                    const targetPitch = catchTargetBarAngle;
                    const pitchEnvelope = Math.sin(progress * Math.PI);
                    const blendedPitch = THREE.MathUtils.lerp(releasePitchX, targetPitch, ease) * (1 - pitchEnvelope * 0.85);
                    bodyMeshGroup.rotation.x = blendedPitch;

                    const totalRad = (currentTrick.degrees * Math.PI) / 180;
                    bodyMeshGroup.rotation.y = baseYaw + ease * totalRad;
                }
                else if (currentTrick.type === 'release') {
                    const basePos = new THREE.Vector3().lerpVectors(releaseAthletePos, catchAthletePos, ease);
                    const arcY = Math.sin(progress * Math.PI) * currentTrick.peakHeight;

                    if (currentTrick.straddle) {
                        const straddleEnv = Math.sin(progress * Math.PI);
                        setBodyPose('straddle', straddleEnv);

                        const tkArcY = Math.sin(progress * Math.PI) * currentTrick.peakHeight;
                        athlete.position.set(0, basePos.y + tkArcY, basePos.z);

                        const archPitch = -worldSwingDir * 0.22 * straddleEnv;
                        bodyMeshGroup.rotation.x = THREE.MathUtils.lerp(releasePitchX, catchTargetBarAngle, ease) + archPitch;
                        bodyMeshGroup.rotation.y = baseYaw;
                    } else {
                        setBodyPose(progress > 0.12 && progress < 0.86 ? 'tuck' : 'hang');

                        let extraZ = 0;
                        if (!currentTrick.crossBar) {
                            const outDist = currentTrick.extraOutZ || 0.58;
                            extraZ = worldSwingDir * Math.sin(progress * Math.PI) * outDist;
                        }

                        athlete.position.set(0, basePos.y + arcY, basePos.z + extraZ);

                        const flipDirection = currentTrick.flips * facingDir;
                        bodyMeshGroup.rotation.x = releasePitchX * (1 - ease) + ease * flipDirection * Math.PI * 2;
                        bodyMeshGroup.rotation.y = baseYaw + ease * currentTrick.twists * Math.PI * 2;
                    }
                }
                else if (currentTrick.type === 'dismount') {
                    const targetZ = worldSwingDir * currentTrick.dist;
                    const endY = LANDED_ATHLETE_Y;

                    const pushCurve = Math.pow(progress, 0.78);
                    const currentZ = THREE.MathUtils.lerp(releaseAthletePos.z, targetZ, pushCurve);
                    const currentY = releaseAthletePos.y * (1 - progress) + endY * progress + (4 * currentTrick.peakHeight * progress * (1 - progress));

                    athlete.position.set(0, currentY, currentZ);

                    if (currentTrick.tuck === false) {
                        setBodyPose('spin');
                    } else {
                        setBodyPose(progress > 0.08 && progress < 0.82 ? 'tuck' : 'hang');
                    }

                    const rotProgress = Math.min(progress / 0.90, 1.0);
                    const rotEase = rotProgress < 0.5
                        ? 2 * rotProgress * rotProgress
                        : 1 - Math.pow(-2 * rotProgress + 2, 2) / 2;

                    const flipSign = currentTrick.flips * facingDir;
                    const isFrontExitFlip = (currentTrick.relReleaseDir === -1 && currentTrick.flips > 0) ||
                                            (currentTrick.relReleaseDir === 1 && currentTrick.flips < 0);
                    const targetEndYaw = isFrontExitFlip
                        ? (worldSwingDir === 1 ? 0 : Math.PI)
                        : (worldSwingDir === 1 ? Math.PI : 0);

                    bodyMeshGroup.rotation.x = releasePitchX * (1 - rotEase) + rotEase * flipSign * Math.PI * 2;
                    bodyMeshGroup.rotation.y = THREE.MathUtils.lerp(baseYaw, targetEndYaw, rotEase) + rotEase * currentTrick.twists * Math.PI * 2;
                }

                if (progress >= 1.0) {
                    onTrickComplete();
                }
            }

            if (cameraMode === 'follow' && bodyMeshGroup) {
                const worldPos = new THREE.Vector3();
                bodyMeshGroup.getWorldPosition(worldPos);
                controls.target.lerp(worldPos, 0.14);
            }

            controls.update();
            renderer.render(scene, camera);
        }

        // ==========================================
        // 5. ממשק משתמש וניהול קומבואים (UI & Combo Logic)
        // ==========================================
        function switchTab(tabName) {
            activeTab = tabName;
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('bg-blue-600', 'text-white');
                btn.classList.add('bg-slate-800', 'text-slate-300');
            });
            const activeBtn = document.getElementById(`tab-${tabName}`);
            activeBtn.classList.remove('bg-slate-800', 'text-slate-300');
            activeBtn.classList.add('bg-blue-600', 'text-white');

            renderTricks();
        }

        function renderTricks() {
            const grid = document.getElementById('tricks-container');
            grid.innerHTML = '';

            TRICKS[activeTab].forEach(trick => {
                const card = document.createElement('div');
                card.className = 'group relative flex items-center justify-between bg-slate-800/90 hover:bg-slate-700/90 border border-slate-700 hover:border-cyan-500/60 rounded-xl p-2.5 transition cursor-pointer';
                
                card.onclick = () => {
                    isPlayingCombo = false;
                    startTrick(trick);
                };

                card.innerHTML = `
                    <div class="pr-1">
                        <div class="text-xs font-bold text-slate-100 group-hover:text-cyan-300 transition">${trick.name}</div>
                        <div class="text-[10px] text-slate-400">${trick.sub}</div>
                    </div>
                    <button title="הוסף לרצף" class="w-7 h-7 rounded-lg bg-slate-900/90 hover:bg-cyan-600 text-cyan-400 hover:text-white font-bold text-sm flex items-center justify-center border border-slate-700 transition shrink-0">
                        +
                    </button>
                `;

                const addBtn = card.querySelector('button');
                addBtn.onclick = (e) => {
                    e.stopPropagation();
                    addToCombo(trick);
                };

                grid.appendChild(card);
            });
        }

        function addToCombo(trick) {
            comboQueue.push(trick);
            renderComboQueue();
        }

        function removeFromCombo(index) {
            comboQueue.splice(index, 1);
            renderComboQueue();
        }

        function clearCombo() {
            comboQueue = [];
            isPlayingCombo = false;
            renderComboQueue();
        }

        function renderComboQueue() {
            const list = document.getElementById('combo-list');
            const playBtn = document.getElementById('btn-play-combo');

            if (comboQueue.length === 0) {
                list.innerHTML = '<span class="text-xs text-slate-500 italic">לחץ על + ליד תרגילים כדי לבנות רצף...</span>';
                playBtn.disabled = true;
                return;
            }

            playBtn.disabled = false;
            list.innerHTML = '';

            comboQueue.forEach((trick, idx) => {
                const pill = document.createElement('span');
                pill.className = 'inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg text-xs font-medium bg-cyan-950/90 text-cyan-200 border border-cyan-700/60';
                pill.innerHTML = `
                    <span>${idx + 1}. ${trick.name}</span>
                    <button class="text-cyan-400 hover:text-rose-400 font-bold ml-1">&times;</button>
                `;
                pill.querySelector('button').onclick = () => removeFromCombo(idx);
                list.appendChild(pill);
            });
        }

        function playCombo() {
            if (comboQueue.length === 0) return;
            isPlayingCombo = true;
            comboIndex = 0;
            startTrick(comboQueue[0]);
        }

        function setCameraView(view) {
            cameraMode = view;
            const followBtn = document.getElementById('btn-follow');
            followBtn.classList.remove('bg-blue-600', 'text-white');

            if (view === 'side') {
                controls.target.set(0, 3.6, 0);
                camera.position.set(11.5, 4.2, 0);
            } else if (view === 'threeQuarter') {
                controls.target.set(0, 3.6, 0);
                camera.position.set(9.2, 4.8, 7.2);
            } else if (view === 'follow') {
                followBtn.classList.add('bg-blue-600', 'text-white');
            }
        }

        function toggleSlowMo() {
            const btn = document.getElementById('btn-slowmo');
            if (slowMoFactor === 1.0) {
                slowMoFactor = 0.5;
                btn.textContent = 'הילוך איטי: 0.5x';
                btn.classList.add('border-amber-500', 'text-amber-300');
            } else if (slowMoFactor === 0.5) {
                slowMoFactor = 0.25;
                btn.textContent = 'הילוך איטי: 0.25x';
            } else {
                slowMoFactor = 1.0;
                btn.textContent = 'הילוך איטי: 1.0x';
                btn.classList.remove('border-amber-500', 'text-amber-300');
            }
        }

        function handleResize() {
            if (!camera || !renderer) return;
            const { w, h } = getViewportSize();
            if (w > 0 && h > 0) {
                camera.aspect = w / h;
                camera.updateProjectionMatrix();
                renderer.setSize(w, h);
            }
        }

        window.addEventListener('resize', handleResize);
        window.addEventListener('DOMContentLoaded', () => {
            renderTricks();
            renderComboQueue();
            initScene();
        });
        window.addEventListener('load', () => {
            initScene();
            handleResize();
        });

        renderTricks();
        renderComboQueue();
        initScene();
    </script>
</body>
</html>
